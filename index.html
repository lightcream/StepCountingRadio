<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Motion Media Player</title>
    <style>
        :root {
            --bg-color: #1a1a1f;
            --neu-bg: #222229;
            --neu-shadow-dark: #121215;
            --neu-shadow-light: #32323d;
            --cyan: #00e0ff;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Neumorphism 基础类 */
        .neu {
            background: var(--neu-bg);
            border-radius: 12px;
            box-shadow: 6px 6px 12px var(--neu-shadow-dark), -6px -6px 12px var(--neu-shadow-light);
            border: 1px solid rgba(255,255,255,0.02);
        }
        .neu-inset {
            background: var(--neu-bg);
            border-radius: 8px;
            box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
        }

        /* 视频容器 */
        #player-container {
            flex: 1;
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* 禁用原生点击暂停 */
        }

        /* 全屏时的律动特效 */
        .rhythm-flash {
            animation: flash 0.3s ease-out;
        }
        @keyframes flash {
            0% { box-shadow: inset 0 0 50px var(--cyan); }
            100% { box-shadow: inset 0 0 0 transparent; }
        }
        .rhythm-vibrate {
            animation: vibrate 0.2s linear;
        }
        @keyframes vibrate {
            0%, 100% { transform: translate(0, 0); }
            25%, 75% { transform: translate(-3px, 2px); }
            50% { transform: translate(3px, -2px); }
        }

        /* 爱心特效 */
        .floating-heart {
            position: absolute;
            color: var(--cyan);
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            text-shadow: 0 0 10px var(--cyan);
            z-index: 999;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* 极细进度条 */
        #thin-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 100;
            cursor: pointer;
        }
        #thin-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
            transition: width 0.1s linear;
            pointer-events: none;
        }

        /* 控制面板悬浮按钮 */
        #toggle-panel-btn, #fullscreen-btn {
            position: absolute;
            top: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--cyan);
            font-weight: bold;
            z-index: 101;
        }
        #toggle-panel-btn { right: 20px; }
        #fullscreen-btn { right: 80px; }
        #toggle-panel-btn:active, #fullscreen-btn:active {
            box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
        }

        /* 设置面板 */
        #settings-panel {
            height: 45vh;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            transition: transform 0.3s ease, height 0.3s ease;
        }
        #settings-panel.hidden {
            height: 0;
            padding: 0 20px;
            transform: translateY(100%);
            overflow: hidden;
        }
        
        /* 隐藏滚动条 */
        #settings-panel::-webkit-scrollbar { width: 6px; }
        #settings-panel::-webkit-scrollbar-thumb { background: var(--neu-shadow-light); border-radius: 3px; }

        .module {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .module-title {
            color: var(--cyan);
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 表单控件 */
        button, input[type="file"]::file-selector-button {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 15px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            text-align: center;
            font-size: 13px;
        }
        button:active, input[type="file"]::file-selector-button:active {
            box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
            color: var(--cyan);
        }
        .btn-cyan {
            color: var(--cyan);
            font-weight: bold;
        }
        .btn-danger {
            color: #ff4757;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
            cursor: pointer;
        }

        input[type="number"], input[type="text"] {
            border: none;
            color: var(--cyan);
            padding: 8px;
            width: 80px;
            text-align: center;
            outline: none;
        }

        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        /* 播放列表 */
        #playlist {
            max-height: 100px;
            overflow-y: auto;
            font-size: 12px;
        }
        .playlist-item {
            padding: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .playlist-item.active {
            color: var(--cyan);
            border-left: 3px solid var(--cyan);
        }

    </style>
</head>
<body>

    <!-- 媒体播放区 -->
    <div id="player-container">
        <video id="main-video" playsinline></video>
        
        <!-- 全屏/隐藏 UI 按钮 -->
        <div id="fullscreen-btn" class="neu">⛶</div>
        <div id="toggle-panel-btn" class="neu">☰</div>

        <!-- 极细进度条 -->
        <div id="thin-progress-bar">
            <div id="thin-progress-fill"></div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel">
        
        <!-- 模块1：媒体管理 -->
        <div class="module neu">
            <div class="module-title">媒体文件池 (Video/Audio)</div>
            <input type="file" id="media-upload" class="neu-inset" multiple accept="video/*,audio/*">
            <div class="flex-row">
                <button class="neu" id="play-pause-btn">播放/暂停</button>
                <label style="font-size: 12px;">
                    <input type="checkbox" id="shuffle-checkbox"> 乱序播放
                </label>
            </div>
            <div id="playlist" class="neu-inset"></div>
        </div>

        <!-- 模块2：基础控制 -->
        <div class="module neu">
            <div class="module-title">播放控制</div>
            <div class="flex-row">
                <span style="font-size: 12px;">全局倍速:</span>
                <input type="range" id="speed-slider" class="neu-inset" min="0.1" max="4" step="0.1" value="1">
                <input type="number" id="speed-input" class="neu-inset" value="1.0" step="0.1">
            </div>
            <div class="flex-row">
                <span style="font-size: 12px;">媒体音量:</span>
                <input type="range" id="volume-slider" class="neu-inset" min="0" max="1" step="0.01" value="1">
            </div>
            <div class="flex-row">
                <button class="neu btn-cyan" id="warmup-btn" style="width: 100%;">预热 (直接增加 2m15s)</button>
            </div>
        </div>

        <!-- 模块3：计步驱动 -->
        <div class="module neu">
            <div class="module-title">计步传感器驱动</div>
            <button class="neu" id="req-sensor-btn">1. 授权获取传感器</button>
            <div class="flex-row">
                <span style="font-size: 12px;">单步增加时长(秒):</span>
                <input type="number" id="step-seconds" class="neu-inset" value="3.0" step="0.1">
            </div>
            <div class="flex-row">
                <span style="font-size: 12px;">防重叠判定(秒):</span>
                <input type="number" id="overlap-seconds" class="neu-inset" value="3.0" step="0.1" title="剩余播放时间低于此值时，触发计步才会生效">
            </div>
            <div style="font-size: 12px; color: var(--cyan); text-align: center;">
                当前剩余播放时间: <span id="remain-time-display">0.0</span>s
            </div>
        </div>

        <!-- 模块4：字幕TTS系统 -->
        <div class="module neu">
            <div class="module-title">智能字幕朗读 (可选)</div>
            <input type="file" id="sub-upload" class="neu-inset" accept=".json,.vtt,.lrc">
            <button class="neu btn-danger" id="remove-sub-btn">移除当前字幕</button>
            <div style="font-size: 11px; color: var(--text-muted);">
                到达字幕时间点时，暂停播放 -> TTS朗读中文 -> 恢复播放。
            </div>
        </div>

        <!-- 模块5：音乐律动系统 -->
        <div class="module neu">
            <div class="module-title">重拍音乐律动 (可选)</div>
            <input type="file" id="music-upload" class="neu-inset" accept="audio/*">
            <div class="flex-row">
                <button class="neu" id="play-music-btn">播放/暂停音乐</button>
                <button class="neu btn-danger" id="remove-music-btn">移除音乐</button>
            </div>
            <div class="flex-row">
                <span style="font-size: 12px;">音乐音量:</span>
                <input type="range" id="music-volume" class="neu-inset" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="flex-row">
                <span style="font-size: 12px;" title="0-255，越小越容易触发">触发阈值(Bass):</span>
                <input type="number" id="rhythm-threshold" class="neu-inset" value="210">
            </div>
            <div class="flex-row">
                <span style="font-size: 12px;">冷却时间(秒):</span>
                <input type="number" id="rhythm-cooldown" class="neu-inset" value="1.50" step="0.01">
            </div>
            <div class="flex-row">
                <span style="font-size: 11px;">避开首(分):</span>
                <input type="number" id="exclude-start" class="neu-inset" value="0" style="width: 50px;">
                <span style="font-size: 11px;">尾(分):</span>
                <input type="number" id="exclude-end" class="neu-inset" value="0" style="width: 50px;">
            </div>
        </div>

    </div>

    <!-- 隐藏的音频标签用于律动 -->
    <audio id="bg-music" loop></audio>

<script>
/** 
 * 全局状态管理 
 */
const state = {
    playlist: [], // {name, url, file}
    currentIndex: -1,
    globalSpeed: 1.0,
    remainPlayTime: 0, // 剩余可播放秒数
    isTTSPlaying: false,
    subs: [], // {start, end, text, read: boolean}
    lastJumpTime: 0
};

// DOM 元素引用
const dom = {
    video: document.getElementById('main-video'),
    container: document.getElementById('player-container'),
    panel: document.getElementById('settings-panel'),
    thinBar: document.getElementById('thin-progress-bar'),
    thinFill: document.getElementById('thin-progress-fill'),
    timeDisplay: document.getElementById('remain-time-display'),
    bgMusic: document.getElementById('bg-music')
};

/**
 * 1. 媒体播放与列表管理 (使用 URL.createObjectURL 优化大文件)
 */
document.getElementById('media-upload').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
        state.playlist.push({
            name: file.name,
            url: URL.createObjectURL(file), // 核心：本地文件流式读取，不占内存
            file: file
        });
    });
    renderPlaylist();
    if (state.currentIndex === -1 && state.playlist.length > 0) {
        playMedia(0);
    }
});

function renderPlaylist() {
    const listDOM = document.getElementById('playlist');
    listDOM.innerHTML = '';
    state.playlist.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `playlist-item ${index === state.currentIndex ? 'active' : ''}`;
        div.innerHTML = `
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80%;">${item.name}</span>
            <span style="color:#ff4757;" onclick="event.stopPropagation(); removeMedia(${index})">✕</span>
        `;
        div.onclick = () => playMedia(index);
        listDOM.appendChild(div);
    });
}

function removeMedia(index) {
    URL.revokeObjectURL(state.playlist[index].url);
    state.playlist.splice(index, 1);
    if (index === state.currentIndex) {
        dom.video.src = '';
        state.currentIndex = -1;
    } else if (index < state.currentIndex) {
        state.currentIndex--;
    }
    renderPlaylist();
}

function playMedia(index) {
    if (!state.playlist[index]) return;
    state.currentIndex = index;
    dom.video.src = state.playlist[index].url;
    // 继承全局倍速
    dom.video.playbackRate = state.globalSpeed;
    renderPlaylist();
    
    // 重置字幕已读状态
    state.subs.forEach(s => s.read = false);
}

// 播放/暂停逻辑 (与计步器联动)
document.getElementById('play-pause-btn').onclick = () => {
    if (dom.video.paused) {
        // 如果手动点播放，给无限时间让其自由播放
        state.remainPlayTime = 999999; 
        dom.video.play();
    } else {
        state.remainPlayTime = 0;
        dom.video.pause();
    }
};

// 列表播放完毕后自动下一集/乱序
dom.video.addEventListener('ended', () => {
    if (state.playlist.length <= 1) return;
    const isShuffle = document.getElementById('shuffle-checkbox').checked;
    let nextIndex = isShuffle 
        ? Math.floor(Math.random() * state.playlist.length)
        : (state.currentIndex + 1) % state.playlist.length;
    playMedia(nextIndex);
    dom.video.play();
});

// 倍速持久化
const updateSpeed = (val) => {
    let speed = parseFloat(val);
    if (speed < 0.1) speed = 0.1;
    state.globalSpeed = speed;
    dom.video.playbackRate = speed;
    document.getElementById('speed-slider').value = speed;
    document.getElementById('speed-input').value = speed;
};
document.getElementById('speed-slider').addEventListener('input', (e) => updateSpeed(e.target.value));
document.getElementById('speed-input').addEventListener('change', (e) => updateSpeed(e.target.value));
// 保证每次新视频加载不丢失倍速
dom.video.addEventListener('loadeddata', () => {
    dom.video.playbackRate = state.globalSpeed;
});

// 媒体音量
document.getElementById('volume-slider').addEventListener('input', (e) => {
    dom.video.volume = parseFloat(e.target.value);
});


/**
 * 2. 进度条 (细条拖动与点击) & 布局切换
 */
dom.thinBar.addEventListener('click', (e) => {
    if (!dom.video.duration) return;
    const rect = dom.thinBar.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    dom.video.currentTime = pos * dom.video.duration;
});

// 支持拖拽进度条
let isDraggingProgress = false;
dom.thinBar.addEventListener('mousedown', () => isDraggingProgress = true);
document.addEventListener('mouseup', () => isDraggingProgress = false);
document.addEventListener('mousemove', (e) => {
    if (isDraggingProgress && dom.video.duration) {
        const rect = dom.thinBar.getBoundingClientRect();
        let pos = (e.clientX - rect.left) / rect.width;
        pos = Math.max(0, Math.min(1, pos));
        dom.video.currentTime = pos * dom.video.duration;
        dom.thinFill.style.width = (pos * 100) + '%';
    }
});

// 原生事件绑定 UI
dom.video.addEventListener('timeupdate', () => {
    if (!isDraggingProgress && dom.video.duration) {
        const percent = (dom.video.currentTime / dom.video.duration) * 100;
        dom.thinFill.style.width = percent + '%';
    }
});

// 面板隐藏/显示
document.getElementById('toggle-panel-btn').onclick = () => {
    dom.panel.classList.toggle('hidden');
};

// 网页全屏 (绕过原生播放器UI)
document.getElementById('fullscreen-btn').onclick = () => {
    if (!document.fullscreenElement) {
        dom.container.requestFullscreen().catch(err => {
            alert(`全屏失败: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
};


/**
 * 3. 计步器核心逻辑与时间池系统
 */
let lastAccel = 0;
let stepCooldown = false;

document.getElementById('req-sensor-btn').onclick = () => {
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
            .then(permissionState => {
                if (permissionState === 'granted') {
                    window.addEventListener('devicemotion', handleMotion);
                    alert('传感器授权成功，开始监测计步！');
                }
            })
            .catch(console.error);
    } else {
        // 安卓或旧版无需授权
        window.addEventListener('devicemotion', handleMotion);
        alert('已启动传感器监测！');
    }
};

function handleMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;
    // 计算向量模长 (排除重力 9.8 后的波动)
    const magnitude = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
    
    // 简单的计步峰值检测
    if (magnitude > 13 && lastAccel <= 13 && !stepCooldown) {
        triggerStep();
        stepCooldown = true;
        setTimeout(() => stepCooldown = false, 400); // 步频限制
    }
    lastAccel = magnitude;
}

function triggerStep() {
    const addSecs = parseFloat(document.getElementById('step-seconds').value) || 3;
    const overlapSecs = parseFloat(document.getElementById('overlap-seconds').value) || 3;
    
    // 规则：只有当时间结束从后往前推X秒，或结束后，触发才会激活
    if (state.remainPlayTime <= overlapSecs) {
        state.remainPlayTime = addSecs; // 覆盖，不叠加
    }

    // 全屏时上漂爱心特效
    if (document.fullscreenElement) {
        createFloatingHeart();
    }
}

document.getElementById('warmup-btn').onclick = () => {
    state.remainPlayTime = 135; // 2分钟15秒 = 135秒
};

function createFloatingHeart() {
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.innerHTML = '❤';
    // 随机位置 (横向 10% 到 90%，纵向底端附近)
    heart.style.left = (10 + Math.random() * 80) + '%';
    heart.style.bottom = (10 + Math.random() * 20) + '%';
    dom.container.appendChild(heart);
    setTimeout(() => heart.remove(), 1500);
}

// 全局播放状态循环管线 (每 100ms 检查)
setInterval(() => {
    // TTS讲话期间，冻结时间流逝和视频播放
    if (state.isTTSPlaying) {
        if (!dom.video.paused) dom.video.pause();
        return; 
    }

    // 更新倒计时时间池
    if (state.remainPlayTime > 0 && state.remainPlayTime !== 999999) {
        state.remainPlayTime -= 0.1;
        if (state.remainPlayTime < 0) state.remainPlayTime = 0;
    }

    // 更新 UI
    dom.timeDisplay.innerText = state.remainPlayTime >= 999999 ? '无限' : state.remainPlayTime.toFixed(1);

    // 控制视频播放/暂停
    if (state.remainPlayTime > 0) {
        if (dom.video.paused && dom.video.src) dom.video.play();
    } else {
        if (!dom.video.paused) dom.video.pause();
    }

    checkSubtitles(); // 检查字幕是否到达触发点

}, 100);


/**
 * 4. 字幕解析与 TTS 系统
 */
document.getElementById('sub-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const content = e.target.result;
        const name = file.name.toLowerCase();
        state.subs = [];
        
        try {
            if (name.endsWith('.json')) {
                const data = JSON.parse(content);
                state.subs = data.map(item => ({
                    start: parseFloat(item.from),
                    text: item.content,
                    read: false
                }));
            } else if (name.endsWith('.lrc')) {
                const lines = content.split('\n');
                const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
                lines.forEach(line => {
                    const match = regex.exec(line);
                    if (match && match[4].trim()) {
                        const m = parseInt(match[1]);
                        const s = parseInt(match[2]);
                        const ms = parseInt(match[3].length === 2 ? match[3]+'0' : match[3]);
                        state.subs.push({
                            start: m * 60 + s + ms / 1000,
                            text: match[4].trim(),
                            read: false
                        });
                    }
                });
            } else if (name.endsWith('.vtt')) {
                const lines = content.split('\n');
                const timeRegex = /(\d{2}):(\d{2}):(\d{2})\.(\d{3})\s*-->/;
                let currentStart = -1;
                for (let i = 0; i < lines.length; i++) {
                    const match = timeRegex.exec(lines[i]);
                    if (match) {
                        const h = parseInt(match[1]), m = parseInt(match[2]), s = parseInt(match[3]), ms = parseInt(match[4]);
                        currentStart = h * 3600 + m * 60 + s + ms / 1000;
                    } else if (currentStart !== -1 && lines[i].trim() !== '' && isNaN(lines[i])) {
                        state.subs.push({ start: currentStart, text: lines[i].trim(), read: false });
                        currentStart = -1;
                    }
                }
            }
            alert(`字幕加载成功，共 ${state.subs.length} 条。`);
        } catch (err) {
            alert('字幕解析失败: ' + err.message);
        }
    };
    reader.readAsText(file);
});

document.getElementById('remove-sub-btn').onclick = () => {
    state.subs = [];
    document.getElementById('sub-upload').value = '';
    alert('字幕功能已解除');
};

function checkSubtitles() {
    if (state.subs.length === 0 || state.isTTSPlaying || dom.video.paused) return;
    
    const curr = dom.video.currentTime;
    // 寻找当前时间点刚好经过且未读的字幕
    const sub = state.subs.find(s => !s.read && curr >= s.start && curr <= s.start + 0.5); // 0.5秒判定窗口
    
    if (sub) {
        sub.read = true;
        // 触发 TTS
        state.isTTSPlaying = true;
        dom.video.pause(); // 暂停原文
        
        const utterance = new SpeechSynthesisUtterance(sub.text);
        utterance.lang = 'zh-CN';
        
        utterance.onend = () => {
            state.isTTSPlaying = false; // 结束后管道会自动恢复视频播放
        };
        utterance.onerror = () => {
            state.isTTSPlaying = false;
        };
        
        window.speechSynthesis.speak(utterance);
    }
}


/**
 * 5. 音乐律动 (Web Audio API 分析)
 */
let audioCtx, analyser, dataArray;
let isRhythmActive = false;

document.getElementById('music-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    dom.bgMusic.src = URL.createObjectURL(file);
    dom.bgMusic.volume = parseFloat(document.getElementById('music-volume').value);
    
    // 初始化 AudioContext
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256; // 分为128个频段
        const source = audioCtx.createMediaElementSource(dom.bgMusic);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
    
    dom.bgMusic.play().then(() => {
        isRhythmActive = true;
        analyzeRhythm();
    }).catch(e => alert('播放音乐失败，请检查浏览器权限。'));
});

document.getElementById('play-music-btn').onclick = () => {
    if(dom.bgMusic.paused) {
        if(audioCtx?.state === 'suspended') audioCtx.resume();
        dom.bgMusic.play();
    } else {
        dom.bgMusic.pause();
    }
};

document.getElementById('remove-music-btn').onclick = () => {
    dom.bgMusic.pause();
    dom.bgMusic.src = '';
    isRhythmActive = false;
    document.getElementById('music-upload').value = '';
    alert('音乐律动已解除');
};

document.getElementById('music-volume').addEventListener('input', e => dom.bgMusic.volume = e.target.value);

function analyzeRhythm() {
    if (!isRhythmActive || dom.bgMusic.paused) return requestAnimationFrame(analyzeRhythm);
    
    analyser.getByteFrequencyData(dataArray);
    
    // 计算低频段能量平均值 (Bass重音区，通常在频段的前几项)
    let bassSum = 0;
    const bassBands = 10; 
    for(let i = 0; i < bassBands; i++) {
        bassSum += dataArray[i];
    }
    const bassAvg = bassSum / bassBands;
    
    const threshold = parseFloat(document.getElementById('rhythm-threshold').value);
    
    if (bassAvg > threshold) {
        const now = performance.now();
        const cooldown = parseFloat(document.getElementById('rhythm-cooldown').value) * 1000;
        
        if (now - state.lastJumpTime > cooldown) {
            state.lastJumpTime = now;
            executeRhythmJump();
        }
    }
    
    requestAnimationFrame(analyzeRhythm);
}

function executeRhythmJump() {
    if (state.playlist.length === 0) return;

    // 1. 乱序跳媒体文件 (如果勾选)
    if (document.getElementById('shuffle-checkbox').checked && state.playlist.length > 1) {
        const randIndex = Math.floor(Math.random() * state.playlist.length);
        if (randIndex !== state.currentIndex) {
            playMedia(randIndex);
        }
    }
    
    // 2. 在安全区间内随机跳转时间
    if (dom.video.readyState >= 1) {
        const dur = dom.video.duration;
        const excStart = parseFloat(document.getElementById('exclude-start').value) * 60 || 0;
        const excEnd = parseFloat(document.getElementById('exclude-end').value) * 60 || 0;
        
        let minTime = excStart;
        let maxTime = dur - excEnd;
        
        if (maxTime <= minTime) { minTime = 0; maxTime = dur; } // 防呆设计
        
        const targetTime = minTime + Math.random() * (maxTime - minTime);
        dom.video.currentTime = targetTime;
        
        // 3. 特效反馈
        if (document.fullscreenElement) {
            // 震动动画
            dom.container.classList.remove('rhythm-vibrate');
            void dom.container.offsetWidth; // trigger reflow
            dom.container.classList.add('rhythm-vibrate');
            
            // 进度条闪动
            dom.thinFill.classList.remove('rhythm-flash');
            void dom.thinFill.offsetWidth;
            dom.thinFill.classList.add('rhythm-flash');
            
            // 物理震动API (限安卓手机)
            if (navigator.vibrate) navigator.vibrate(50);
        }
    }
}
