<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Sync Player</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #20B2AA;
            --panel-bg: rgba(18, 18, 18, 0.85);
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
        
        /* Video Container */
        #media-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        video { max-width: 100%; max-height: 100%; object-fit: contain; width: 100%; height: 100%; pointer-events: none; } /* hide native controls visually but allow our JS */
        
        /* Step Glow Effect */
        #glow-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 50px 10px var(--accent-color); transition: opacity 0.3s ease-out; z-index: 5; }
        #glow-overlay.active { opacity: 1; transition: none; transform: scale(0.995); border: 2px solid var(--accent-color); }

        /* Thin Progress Bar (Always visible) */
        #thin-progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: #333; z-index: 20; cursor: pointer; transition: height 0.2s; }
        #thin-progress-container:hover { height: 8px; }
        #thin-progress-bar { height: 100%; width: 0%; background: var(--accent-color); position: relative; }
        #thin-progress-container.vibrating { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Percentage Display */
        #progress-percentage { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--accent-color); text-shadow: 0 0 4px #000; z-index: 20; opacity: 0; transition: opacity 0.3s; }
        #media-container:hover #progress-percentage, .is-fullscreen #progress-percentage { opacity: 1; }

        /* Settings Panel */
        #settings-panel { position: absolute; bottom: 4px; left: 0; width: 100%; background: var(--panel-bg); backdrop-filter: blur(10px); z-index: 10; padding: 20px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); max-height: 80vh; overflow-y: auto; border-top: 1px solid #333; }
        #settings-panel.open { transform: translateY(0); }
        
        /* Grid Layout for settings */
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding-bottom: 20px; }
        .setting-group { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border-left: 3px solid var(--accent-color); }
        .setting-group h3 { margin-bottom: 15px; font-size: 16px; color: var(--accent-color); display: flex; justify-content: space-between; }
        
        /* Controls */
        label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        input[type="range"] { flex: 1; margin: 0 10px; accent-color: var(--accent-color); }
        input[type="number"], input[type="text"] { background: #000; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 4px; width: 70px; text-align: center; }
        input[type="number"]:focus, input[type="text"]:focus { border-color: var(--accent-color); outline: none; }
        button, label.btn-upload { background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s; text-align: center; display: inline-block; }
        button:hover, label.btn-upload:hover { background: var(--accent-color); color: #000; }
        button.active { background: var(--accent-color); color: #000; }
        input[type="file"] { display: none; }

        /* Playlist */
        #playlist { list-style: none; max-height: 150px; overflow-y: auto; margin-top: 10px; font-size: 13px; }
        #playlist li { padding: 8px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        #playlist li:hover { background: rgba(32, 178, 170, 0.2); }
        #playlist li.playing { color: var(--accent-color); font-weight: bold; }
        .remove-btn { color: #ff4444; border: none; font-size: 12px; padding: 2px 6px; }
        .remove-btn:hover { background: #ff4444; color: #fff; border-color: transparent; }

        /* Edge Buttons */
        .edge-btn { position: absolute; background: rgba(32, 178, 170, 0.3); color: var(--text-color); border: none; z-index: 30; width: 30px; height: 50px; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(5px); transition: width 0.2s, background 0.2s; border-radius: 8px; }
        .edge-btn:hover { background: var(--accent-color); color: #000; width: 40px; }
        #toggle-panel-btn { bottom: 20px; right: -5px; border-radius: 10px 0 0 10px; }
        #fullscreen-btn { top: 20px; right: -5px; border-radius: 10px 0 0 10px; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 3px; }

    </style>
</head>
<body>

    <div id="media-container">
        <video id="main-video" playsinline></video>
        <div id="glow-overlay"></div>
        <div id="progress-percentage">0.00%</div>
        
        <!-- Edge Triggers -->
        <div id="toggle-panel-btn" class="edge-btn" title="显示/隐藏设置">⚙</div>
        <div id="fullscreen-btn" class="edge-btn" title="全屏">⛶</div>
    </div>

    <!-- Always visible thin progress bar -->
    <div id="thin-progress-container">
        <div id="thin-progress-bar"></div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="open">
        <div class="settings-grid">
            <!-- 媒体控制 -->
            <div class="setting-group">
                <h3>媒体与播放 
                    <div>
                        <label class="btn-upload">添加媒体 <input type="file" id="media-upload" accept="video/*, audio/*" multiple></label>
                    </div>
                </h3>
                <label>顺序模式 
                    <button id="shuffle-btn">乱序播放: 关</button>
                </label>
                <label>播放速度 <input type="range" id="speed-slider" min="0.1" max="4.0" step="0.1" value="1.0"> <input type="number" id="speed-input" value="1.0" step="0.1"></label>
                <label>全局音量 <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1.0"></label>
                <ul id="playlist"></ul>
            </div>

            <!-- 计步器控制 -->
            <div class="setting-group">
                <h3>运动联动系统 <button id="req-motion-btn">授权传感器</button></h3>
                <label>计步触发播放时长 (秒) <input type="number" id="step-duration" value="5"></label>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button id="warmup-btn" style="flex: 1;">🔥 预热 (自动播 3分45秒)</button>
                    <button id="stop-warmup-btn" style="flex: 1; border-color: #555; color: #aaa;">停止预热</button>
                </div>
                <div style="margin-top: 10px; font-size: 12px; color: var(--text-muted);">
                    * 触发不会叠加时间。播放结束前新的计步无效。全屏时触发有边缘撞击光效。
                </div>
            </div>

            <!-- 字幕控制 -->
            <div class="setting-group">
                <h3>智能字幕 TTS 
                    <div>
                        <label class="btn-upload">上传字幕 <input type="file" id="sub-upload" accept=".json,.lrc,.vtt"></label>
                        <button id="remove-sub-btn" class="remove-btn">移除</button>
                    </div>
                </h3>
                <div id="sub-status" style="font-size: 13px; margin-bottom: 10px; color: var(--text-muted);">当前无字幕</div>
                <div style="font-size: 12px; color: var(--text-muted); line-height: 1.5;">
                    * 支持 JSON/LRC/VTT。进度条到达字幕时间点时会暂停原文播放，调用本地 TTS 朗读中文一遍，然后继续播放原文。无字幕区域正常播放。
                </div>
            </div>

            <!-- 音乐律动控制 -->
            <div class="setting-group">
                <h3>音乐律动卡点 
                    <div>
                        <label class="btn-upload">上传音乐 <input type="file" id="music-upload" accept="audio/*"></label>
                        <button id="remove-music-btn" class="remove-btn">移除</button>
                    </div>
                </h3>
                <div id="music-status" style="font-size: 13px; margin-bottom: 10px; color: var(--text-muted);">当前无音乐</div>
                <label>触发阈值 (0-255) <input type="range" id="beat-threshold" min="0" max="255" value="180"> <span id="threshold-val">180</span></label>
                <label>跳跃冷却时间 (秒) <input type="number" id="beat-cooldown" value="1.50" step="0.01"></label>
                <label>跳过开头 (分钟) <input type="number" id="exclude-start" value="0" step="0.1"></label>
                <label>跳过结尾 (分钟) <input type="number" id="exclude-end" value="0" step="0.1"></label>
            </div>
        </div>
    </div>

<script>
    // === 核心状态与元素 ===
    const video = document.getElementById('main-video');
    const panel = document.getElementById('settings-panel');
    const thinProgress = document.getElementById('thin-progress-container');
    const thinBar = document.getElementById('thin-progress-bar');
    const progressText = document.getElementById('progress-percentage');
    
    // 媒体状态
    let playlist = [];
    let currentIndex = -1;
    let isShuffle = false;
    let globalPlaybackRate = 1.0;
    
    // 计步状态
    let lastAcc = 0;
    let isStepPlaying = false;
    let stepTimer = null;
    let isWarmup = false;
    let warmupTimer = null;
    let userHasInteracted = false; // 需要用户交互才能播放音频

    // 字幕状态
    let subtitles = [];
    let currentSubIndex = 0;
    let isTTSActive = false;
    
    // 律动状态
    let audioCtx, analyser, dataArray, musicSource, beatAnimFrame, backgroundMusic;
    let isBeatCooldown = false;

    // === 交互与UI初始化 ===
    document.body.addEventListener('click', () => userHasInteracted = true, {once: true});
    
    document.getElementById('toggle-panel-btn').addEventListener('click', () => {
        panel.classList.toggle('open');
    });

    document.getElementById('fullscreen-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
            document.exitFullscreen();
        }
    });

    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            panel.classList.remove('open'); // 全屏自动收起面板
            document.body.classList.add('is-fullscreen');
        } else {
            document.body.classList.remove('is-fullscreen');
        }
    });

    // === 媒体播放列表逻辑 ===
    document.getElementById('media-upload').addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            playlist.push({ file: file, url: URL.createObjectURL(file) });
        });
        updatePlaylistUI();
        if (currentIndex === -1 && playlist.length > 0) playMedia(0);
        e.target.value = '';
    });

    function updatePlaylistUI() {
        const list = document.getElementById('playlist');
        list.innerHTML = '';
        playlist.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = index === currentIndex ? 'playing' : '';
            
            const titleSpan = document.createElement('span');
            titleSpan.textContent = item.file.name;
            titleSpan.style.flex = "1";
            titleSpan.style.overflow = "hidden";
            titleSpan.style.textOverflow = "ellipsis";
            titleSpan.style.whiteSpace = "nowrap";
            
            li.onclick = (e) => { if(e.target.tagName !== 'BUTTON') playMedia(index); };
            
            const rmBtn = document.createElement('button');
            rmBtn.textContent = '删除';
            rmBtn.className = 'remove-btn';
            rmBtn.onclick = (e) => {
                e.stopPropagation();
                URL.revokeObjectURL(item.url);
                playlist.splice(index, 1);
                if (index === currentIndex) {
                    currentIndex = -1; video.src = '';
                    if (playlist.length > 0) playMedia(0);
                } else if (index < currentIndex) {
                    currentIndex--;
                }
                updatePlaylistUI();
            };
            
            li.appendChild(titleSpan);
            li.appendChild(rmBtn);
            list.appendChild(li);
        });
    }

    function playMedia(index) {
        if (playlist.length === 0) return;
        currentIndex = index;
        video.src = playlist[index].url;
        video.playbackRate = globalPlaybackRate;
        video.play().catch(e=>console.log("等待交互后播放"));
        updatePlaylistUI();
        currentSubIndex = 0; // 重置字幕进度
    }

    video.addEventListener('loadedmetadata', () => {
        video.playbackRate = globalPlaybackRate;
    });

    video.addEventListener('ended', () => {
        if (playlist.length <= 1) return;
        if (isShuffle) {
            let next = currentIndex;
            while(next === currentIndex) next = Math.floor(Math.random() * playlist.length);
            playMedia(next);
        } else {
            playMedia((currentIndex + 1) % playlist.length);
        }
    });

    document.getElementById('shuffle-btn').addEventListener('click', (e) => {
        isShuffle = !isShuffle;
        e.target.textContent = `乱序播放: ${isShuffle ? '开' : '关'}`;
        e.target.classList.toggle('active');
    });

    // === 倍速与音量持久化 ===
    const speedSlider = document.getElementById('speed-slider');
    const speedInput = document.getElementById('speed-input');
    
    function updateSpeed(val) {
        let v = parseFloat(val);
        if(isNaN(v)) return;
        globalPlaybackRate = v;
        video.playbackRate = globalPlaybackRate;
        speedSlider.value = v;
        speedInput.value = v;
    }
    speedSlider.addEventListener('input', e => updateSpeed(e.target.value));
    speedInput.addEventListener('change', e => updateSpeed(e.target.value));

    document.getElementById('volume-slider').addEventListener('input', e => {
        video.volume = e.target.value;
    });

    // === 进度条逻辑 (完全解耦无 Bug 拖动) ===
    function updateProgress() {
        if (!video.duration) return;
        const percent = (video.currentTime / video.duration) * 100;
        thinBar.style.width = `${percent}%`;
        progressText.textContent = `${percent.toFixed(2)}%`;
    }
    video.addEventListener('timeupdate', updateProgress);

    thinProgress.addEventListener('mousedown', (e) => {
        if (!video.duration) return;
        const rect = thinProgress.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        video.currentTime = pos * video.duration;
        
        // 同步拖动更新字幕索引防止乱跳
        syncSubtitleIndex();
    });

    // === 计步器与播放控制核心 ===
    document.getElementById('req-motion-btn').addEventListener('click', () => {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        window.addEventListener('devicemotion', handleMotion);
                        alert("授权成功！开始运动吧。");
                    }
                })
                .catch(console.error);
        } else {
            window.addEventListener('devicemotion', handleMotion);
            alert("已开启传感器监听。");
        }
    });

    function handleMotion(e) {
        let acc = e.accelerationIncludingGravity;
        if (!acc) return;
        let mag = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
        if (lastAcc !== 0) {
            let delta = Math.abs(mag - lastAcc);
            if (delta > 2.5) { // 运动阈值
                triggerStepAction();
            }
        }
        lastAcc = mag;
    }

    function triggerStepAction() {
        // 触发边缘光效
        if (document.fullscreenElement) {
            const glow = document.getElementById('glow-overlay');
            glow.classList.add('active');
            setTimeout(() => glow.classList.remove('active'), 150);
        }

        if (isWarmup || isTTSActive || playlist.length === 0) return;

        if (!isStepPlaying) {
            isStepPlaying = true;
            video.play();
            const dur = parseFloat(document.getElementById('step-duration').value) * 1000;
            stepTimer = setTimeout(() => {
                video.pause();
                isStepPlaying = false;
            }, dur);
        }
        // 如果正在播放（isStepPlaying == true），则不叠加时间，直接 return
    }

    // 预热
    document.getElementById('warmup-btn').addEventListener('click', () => {
        if(playlist.length === 0) return alert("请先上传媒体！");
        clearTimeout(stepTimer);
        isStepPlaying = false;
        isWarmup = true;
        video.play();
        warmupTimer = setTimeout(() => {
            isWarmup = false;
            video.pause();
        }, 3 * 60 * 1000 + 45 * 1000); // 3m45s
    });

    document.getElementById('stop-warmup-btn').addEventListener('click', () => {
        clearTimeout(warmupTimer);
        isWarmup = false;
        video.pause();
    });

    // === 智能字幕 TTS ===
    document.getElementById('sub-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            parseSubtitle(evt.target.result, file.name);
            document.getElementById('sub-status').textContent = `已加载: ${file.name}`;
        };
        reader.readAsText(file);
    });

    document.getElementById('remove-sub-btn').addEventListener('click', () => {
        subtitles = [];
        currentSubIndex = 0;
        document.getElementById('sub-status').textContent = '当前无字幕';
        document.getElementById('sub-upload').value = '';
    });

    function parseSubtitle(text, filename) {
        subtitles = [];
        const ext = filename.split('.').pop().toLowerCase();
        
        try {
            if (ext === 'json') {
                const arr = JSON.parse(text);
                subtitles = arr.map(item => ({ start: parseFloat(item.from), text: item.content }));
            } else if (ext === 'lrc') {
                const lines = text.split('\n');
                const regex = /\[(\d+):(\d+\.\d+)\](.*)/;
                lines.forEach(line => {
                    const m = line.match(regex);
                    if (m && m[3].trim()) subtitles.push({ start: parseInt(m[1])*60 + parseFloat(m[2]), text: m[3].trim() });
                });
            } else if (ext === 'vtt') {
                const blocks = text.split(/\n\s*\n/);
                blocks.forEach(block => {
                    const lines = block.split('\n');
                    const timeLine = lines.find(l => l.includes('-->'));
                    if (timeLine) {
                        const startStr = timeLine.split('-->')[0].trim();
                        const parts = startStr.split(':');
                        let start = 0;
                        if(parts.length === 3) start = parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseFloat(parts[2]);
                        else if (parts.length === 2) start = parseInt(parts[0])*60 + parseFloat(parts[1]);
                        const textLines = lines.slice(lines.indexOf(timeLine)+1).join(' ').trim();
                        if(textLines) subtitles.push({ start, text: textLines });
                    }
                });
            }
            subtitles.sort((a,b) => a.start - b.start);
            syncSubtitleIndex();
        } catch (e) { alert("字幕解析失败，请检查格式。"); }
    }

    function syncSubtitleIndex() {
        const ct = video.currentTime;
        currentSubIndex = subtitles.findIndex(s => s.start >= ct);
        if (currentSubIndex === -1) currentSubIndex = subtitles.length; // 到头了
    }

    video.addEventListener('timeupdate', () => {
        if (subtitles.length === 0 || isTTSActive) return;
        if (currentSubIndex < subtitles.length) {
            const nextSub = subtitles[currentSubIndex];
            // 当进度条达到或超过字幕起点极小范围时触发
            if (video.currentTime >= nextSub.start && video.currentTime <= nextSub.start + 0.5) {
                // 暂停视频，调用 TTS
                const wasPlaying = !video.paused;
                video.pause();
                isTTSActive = true;
                
                const utterance = new SpeechSynthesisUtterance(nextSub.text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.2; // 稍微快一点
                
                utterance.onend = () => {
                    isTTSActive = false;
                    currentSubIndex++;
                    // 如果在此之前是因为计步或者预热处于播放状态，则继续播放原文
                    if (wasPlaying) {
                        video.play();
                    }
                };
                utterance.onerror = () => { isTTSActive = false; currentSubIndex++; if(wasPlaying) video.play(); };
                
                window.speechSynthesis.speak(utterance);
            }
        }
    });


    // === 音乐律动卡点 (Web Audio API) ===
    document.getElementById('music-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        document.getElementById('music-status').textContent = `已加载: ${file.name}`;
        
        if (backgroundMusic) {
            backgroundMusic.pause();
            if(audioCtx) audioCtx.close();
        }

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        
        backgroundMusic = new Audio(URL.createObjectURL(file));
        backgroundMusic.loop = true;
        
        musicSource = audioCtx.createMediaElementSource(backgroundMusic);
        musicSource.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        backgroundMusic.play().catch(e=>console.log("等待交互后播放音乐"));
        
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        detectBeat();
    });

    document.getElementById('remove-music-btn').addEventListener('click', () => {
        if (backgroundMusic) {
            backgroundMusic.pause();
            backgroundMusic = null;
        }
        if (beatAnimFrame) cancelAnimationFrame(beatAnimFrame);
        if (audioCtx) { audioCtx.close(); audioCtx = null; }
        document.getElementById('music-status').textContent = '当前无音乐';
        document.getElementById('music-upload').value = '';
    });

    document.getElementById('beat-threshold').addEventListener('input', (e) => {
        document.getElementById('threshold-val').textContent = e.target.value;
    });

    function detectBeat() {
        if(!audioCtx) return;
        beatAnimFrame = requestAnimationFrame(detectBeat);
        analyser.getByteFrequencyData(dataArray);
        
        // 取低频区间 (0-10 bin) 代表重低音、鼓点
        let sum = 0;
        for(let i=0; i<10; i++) sum += dataArray[i];
        let avg = sum / 10;
        
        const threshold = parseInt(document.getElementById('beat-threshold').value);
        
        if (avg > threshold && !isBeatCooldown && video.duration) {
            triggerJump();
            
            // 冷却
            isBeatCooldown = true;
            const cd = parseFloat(document.getElementById('beat-cooldown').value) * 1000;
            setTimeout(() => isBeatCooldown = false, cd);
        }
    }

    function triggerJump() {
        const excludeStart = parseFloat(document.getElementById('exclude-start').value) * 60;
        const excludeEnd = parseFloat(document.getElementById('exclude-end').value) * 60;
        
        const minTime = excludeStart;
        const maxTime = Math.max(minTime, video.duration - excludeEnd);
        
        if (maxTime > minTime) {
            const randomTime = Math.random() * (maxTime - minTime) + minTime;
            video.currentTime = randomTime;
            syncSubtitleIndex();
            
            // 进度条震动效果
            if (document.fullscreenElement) {
                thinProgress.classList.remove('vibrating');
                void thinProgress.offsetWidth; // 触发重绘
                thinProgress.classList.add('vibrating');
            }
        }
    }

</script>
</body>
