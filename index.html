<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动律动媒体播放器</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --panel-bg: rgba(25, 25, 30, 0.85);
            --theme-color: #00e5ff;
            --text-color: #f1f1f1;
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* 核心容器与媒体元素 */
        #player-container {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        #main-media {
            width: 100%; height: 100%; object-fit: contain; pointer-events: none;
        }

        /* 底部交互UI层 */
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 50;
            display: flex; flex-direction: column; justify-content: flex-end;
        }

        /* 细条进度条 */
        #progress-wrapper {
            width: 100%; height: 6px; background: rgba(255,255,255,0.2);
            cursor: pointer; position: relative; z-index: 51;
            transition: height 0.2s;
        }
        #progress-wrapper:hover { height: 10px; }
        #progress-fill {
            width: 0%; height: 100%; background: var(--theme-color);
            box-shadow: 0 0 10px var(--theme-color); pointer-events: none;
        }

        /* 设置面板 (毛玻璃) */
        #settings-panel {
            width: 100%; max-height: 75vh; overflow-y: auto;
            background: var(--panel-bg); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1);
            transition: max-height 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), padding 0.4s;
            padding: 20px;
        }
        #settings-panel.hidden { max-height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; border: none; }
        
        /* 面板内部网格排版 */
        .panel-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;
        }
        .card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; }
        h3 { margin: 0 0 12px 0; font-size: 16px; color: var(--theme-color); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;}
        
        /* 表单元素美化 */
        label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        input[type="number"], input[type="text"] {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 6px 10px; border-radius: 6px; width: 80px; outline: none;
        }
        input[type="range"] {
            width: 120px; accent-color: var(--theme-color); margin-left: 10px;
        }
        input[type="file"] { font-size: 12px; width: 100%; color: #aaa; }
        input[type="file"]::file-selector-button {
            background: var(--theme-color); color: #000; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        
        button {
            background: var(--theme-color); color: #000; border: none;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;
            transition: opacity 0.2s; width: 100%; margin-top: 5px;
        }
        button:active { opacity: 0.7; }
        button.outline { background: transparent; border: 1px solid var(--theme-color); color: var(--theme-color); }
        
        /* 播放列表 */
        .playlist-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 5px; font-size: 12px;
        }
        .playlist-item.active { border-left: 3px solid var(--theme-color); background: rgba(0, 229, 255, 0.1); }
        .del-btn { background: #ff4757; padding: 4px 8px; font-size: 12px; width: auto; margin:0; }

        /* 顶部悬浮控制条 (用于切换面板和全屏) */
        #top-controls {
            position: absolute; top: 15px; right: 15px; z-index: 60; display: flex; gap: 10px;
        }
        #top-controls button { width: auto; padding: 8px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* 视觉特效动画 */
        @keyframes impactGlow {
            0% { box-shadow: inset 0 0 0px rgba(0,229,255,0); border: 0px solid transparent; }
            10% { box-shadow: inset 0 0 60px 15px rgba(0,229,255,0.9); border: 2px solid var(--theme-color); }
            100% { box-shadow: inset 0 0 0px rgba(0,229,255,0); border: 0px solid transparent; }
        }
        .glow-hit { animation: impactGlow 0.5s ease-out; }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(-8px, 5px) rotate(-1deg) scale(1.02); }
            40% { transform: translate(8px, -5px) rotate(1deg) scale(1.02); }
            60% { transform: translate(-5px, -3px) rotate(0deg) scale(1.01); }
            80% { transform: translate(5px, 3px) rotate(0deg) scale(1.01); }
        }
        .shake-hit { animation: screenShake 0.4s; }

        /* 隐藏原生滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="player-container">
        <!-- 视频容器 (不使用controls属性，隐藏原生播放UI) -->
        <video id="main-media" playsinline></video>
        <!-- 独立的音频用于音乐律动检测 -->
        <audio id="rhythm-audio" loop></audio>
        
        <div id="top-controls">
            <button id="auth-btn">激活传感器与核心功能</button>
            <button id="toggle-panel-btn">隐藏设置</button>
            <button id="fullscreen-btn">全屏</button>
        </div>

        <div id="ui-layer">
            <div id="progress-wrapper">
                <div id="progress-fill"></div>
            </div>
            
            <div id="settings-panel">
                <div class="panel-grid">
                    <!-- 媒体管理 -->
                    <div class="card">
                        <h3>1. 媒体列表 (音视频)</h3>
                        <input type="file" id="media-upload" multiple accept="video/*, audio/*">
                        <label style="margin-top: 10px;"><input type="checkbox" id="random-play"> 乱序播放</label>
                        <div id="playlist-container" style="max-height: 120px; overflow-y: auto; margin-top: 10px;"></div>
                    </div>

                    <!-- 播放控制 -->
                    <div class="card">
                        <h3>2. 播放控制</h3>
                        <label>播放倍速: 
                            <input type="range" id="speed-slider" min="0.1" max="4" step="0.1" value="1">
                            <input type="number" id="speed-input" value="1" step="0.1" style="width:60px; margin-left: 5px;">
                        </label>
                        <label>媒体音量: 
                            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
                        </label>
                        <label>音乐音量: 
                            <input type="range" id="music-vol-slider" min="0" max="1" step="0.01" value="0.5">
                        </label>
                    </div>

                    <!-- 计步传感器与预热 -->
                    <div class="card">
                        <h3>3. 传感器控制</h3>
                        <label>计步触发播放时长 (秒): <input type="number" id="step-time" value="5"></label>
                        <button id="warmup-btn" class="outline">预热 (直接播放 3分45秒)</button>
                    </div>

                    <!-- 字幕与TTS -->
                    <div class="card">
                        <h3>4. 字幕文件 (可选)</h3>
                        <input type="file" id="sub-upload" accept=".json, .vtt, .lrc">
                        <div style="font-size: 11px; color: #888; margin-top: 5px;">支持 JSON, VTT, LRC。加载后自动启用TTS领读模式。</div>
                    </div>

                    <!-- 音乐律动 -->
                    <div class="card">
                        <h3>5. 音乐律动跳跃 (可选)</h3>
                        <input type="file" id="music-upload" accept="audio/*">
                        <label>触发阈值 (0-255): <input type="number" id="beat-threshold" value="200"></label>
                        <label>忽略头部 (分钟): <input type="number" id="ignore-start" value="1"></label>
                        <label>忽略尾部 (分钟): <input type="number" id="ignore-end" value="1"></label>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    /* ================= 核心状态变量 ================= */
    const media = document.getElementById('main-media');
    const rhythmAudio = document.getElementById('rhythm-audio');
    const container = document.getElementById('player-container');
    
    let playlist = [];
    let currentTrackIdx = 0;
    
    // 播放时间控制
    let systemPlayTimer = null; // 控制有效播放窗口的定时器
    
    // 倍速控制（全局保留）
    let globalSpeed = 1.0;
    
    // 字幕与TTS状态
    let subtitles = [];
    let nextSubIndex = 0;
    let ttsIsSpeaking = false;
    
    // 律动状态
    let audioCtx, musicAnalyser, dataArray;
    let lastJumpTime = 0;
    let isRhythmActive = false;

    // 计步防抖
    let lastStepTime = 0;
    let isDragging = false; // 进度条拖拽防冲突

    /* ================= 1. 基础 UI 与 播放器绑定 ================= */
    
    // 隐藏/显示面板
    document.getElementById('toggle-panel-btn').addEventListener('click', (e) => {
        const panel = document.getElementById('settings-panel');
        panel.classList.toggle('hidden');
        e.target.innerText = panel.classList.contains('hidden') ? '显示设置' : '隐藏设置';
    });

    // 全屏控制
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => alert("全屏请求失败: " + err.message));
        } else {
            document.exitFullscreen();
        }
    });

    // 倍速同步更新 (拖拽和键盘输入互相绑定，跨视频生效)
    const speedSlider = document.getElementById('speed-slider');
    const speedInput = document.getElementById('speed-input');
    function updateSpeed(val) {
        globalSpeed = parseFloat(val) || 1;
        speedSlider.value = globalSpeed;
        speedInput.value = globalSpeed;
        media.playbackRate = globalSpeed;
    }
    speedSlider.addEventListener('input', e => updateSpeed(e.target.value));
    speedInput.addEventListener('change', e => updateSpeed(e.target.value));

    // 音量控制
    document.getElementById('vol-slider').addEventListener('input', e => { media.volume = e.target.value; });
    document.getElementById('music-vol-slider').addEventListener('input', e => { rhythmAudio.volume = e.target.value; });

    // 核心：进度条拖拽功能
    const progWrapper = document.getElementById('progress-wrapper');
    const progFill = document.getElementById('progress-fill');

    function updateProgressUI() {
        if(!isDragging && media.duration) {
            progFill.style.width = (media.currentTime / media.duration * 100) + '%';
        }
    }
    media.addEventListener('timeupdate', updateProgressUI);

    function calcProgressFromEvent(e) {
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let rect = progWrapper.getBoundingClientRect();
        let percent = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
        progFill.style.width = (percent * 100) + '%';
        if (media.duration) media.currentTime = percent * media.duration;
    }

    progWrapper.addEventListener('mousedown', e => { isDragging = true; calcProgressFromEvent(e); });
    document.addEventListener('mousemove', e => { if(isDragging) calcProgressFromEvent(e); });
    document.addEventListener('mouseup', () => { 
        if(isDragging) { isDragging = false; syncSubIndex(); } // 拖拽结束后重置TTS同步索引
    });
    // 触屏支持
    progWrapper.addEventListener('touchstart', e => { isDragging = true; calcProgressFromEvent(e); }, {passive: true});
    document.addEventListener('touchmove', e => { if(isDragging) calcProgressFromEvent(e); }, {passive: true});
    document.addEventListener('touchend', () => { if(isDragging) { isDragging = false; syncSubIndex(); }});

    /* ================= 2. 播放列表管理 ================= */
    document.getElementById('media-upload').addEventListener('change', (e) => {
        let newFiles = Array.from(e.target.files);
        newFiles.forEach(file => {
            playlist.push({ file: file, name: file.name, url: URL.createObjectURL(file) });
        });
        renderPlaylist();
        if(playlist.length > 0 && !media.src) playTrack(0); // 默认加载第一个
    });

    function renderPlaylist() {
        const pContainer = document.getElementById('playlist-container');
        pContainer.innerHTML = '';
        playlist.forEach((item, index) => {
            let div = document.createElement('div');
            div.className = `playlist-item ${index === currentTrackIdx ? 'active' : ''}`;
            div.innerHTML = `
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80%;">${item.name}</span>
                <button class="del-btn">移除</button>
            `;
            // 点击切换播放
            div.addEventListener('click', (e) => {
                if(e.target.classList.contains('del-btn')) {
                    playlist.splice(index, 1);
                    if(index === currentTrackIdx) media.src = ''; // 移除了当前正在播放的
                    renderPlaylist();
                } else {
                    playTrack(index);
                }
            });
            pContainer.appendChild(div);
        });
    }

    function playTrack(index) {
        if(index < 0 || index >= playlist.length) return;
        currentTrackIdx = index;
        media.src = playlist[index].url;
        renderPlaylist();
        
        // 只有当存在有效播放窗口时，才允许播放
        if(systemPlayTimer && !ttsIsSpeaking) media.play().catch(e=>console.log(e));
    }

    media.addEventListener('loadedmetadata', () => {
        media.playbackRate = globalSpeed; // 确保新视频继承倍速设置
        syncSubIndex(); 
    });

    media.addEventListener('ended', () => {
        if(playlist.length <= 1) return;
        let isRandom = document.getElementById('random-play').checked;
        let nextIdx = isRandom ? Math.floor(Math.random() * playlist.length) : (currentTrackIdx + 1) % playlist.length;
        playTrack(nextIdx);
    });

    /* ================= 3. 计步传感器与计时播放引擎 ================= */
    
    // 初始化权限(iOS 需要用户手动点击按钮触发)
    document.getElementById('auth-btn').addEventListener('click', () => {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(state => {
                    if(state === 'granted') window.addEventListener('devicemotion', handleMotion);
                    else alert("传感器权限被拒绝");
                }).catch(console.error);
        } else {
            window.addEventListener('devicemotion', handleMotion);
        }
        
        // 初始化TTS引擎(防止iOS静音)
        let utter = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(utter);
        
        // 初始化 Web Audio API 用于音乐律动
        if(!audioCtx) initAudioRhythm();
        
        document.getElementById('auth-btn').style.display = 'none';
    });

    // 计步逻辑 (基于加速度向量阈值)
    function handleMotion(e) {
        let ag = e.accelerationIncludingGravity;
        if(!ag) return;
        let mag = Math.sqrt(ag.x*ag.x + ag.y*ag.y + ag.z*ag.z);
        
        if (mag > 13) { // 阈值13通常对应轻微震动/走步
            let now = Date.now();
            if(now - lastStepTime > 400) { // 400ms防抖
                lastStepTime = now;
                triggerPlayWindow(parseFloat(document.getElementById('step-time').value) || 5);
                triggerVisualEffects();
            }
        }
    }

    // 预热按钮 (直接播放225秒)
    document.getElementById('warmup-btn').addEventListener('click', () => {
        if(systemPlayTimer) clearTimeout(systemPlayTimer);
        systemPlayTimer = null;
        triggerPlayWindow(225); 
    });

    // 核心引擎：开启播放窗口
    function triggerPlayWindow(durationSec) {
        // 如果已有窗口在运行，绝不叠加时间！
        if(systemPlayTimer) return; 

        // 如果TTS没有在说话，并且有视频，就播放
        if(!ttsIsSpeaking && playlist.length > 0) {
            media.play().catch(e=>console.log(e));
        }
        
        // 律动音乐同步
        if(isRhythmActive && !ttsIsSpeaking) rhythmAudio.play();

        systemPlayTimer = setTimeout(() => {
            media.pause();
            if(isRhythmActive) rhythmAudio.pause();
            systemPlayTimer = null;
        }, durationSec * 1000);
    }

    // 全屏时触发特效 (薄光晕+撞击感)
    function triggerVisualEffects() {
        if (document.fullscreenElement) {
            container.classList.remove('glow-hit');
            void container.offsetWidth; // 触发重绘重排
            container.classList.add('glow-hit');
        }
    }

    /* ================= 4. 字幕与 TTS 处理模块 ================= */
    document.getElementById('sub-upload').addEventListener('change', async (e) => {
        let file = e.target.files[0];
        if(!file) return;
        let text = await file.text();
        subtitles = [];
        
        if (file.name.endsWith('.json')) {
            let arr = JSON.parse(text);
            subtitles = arr.map(i => ({ start: i.from, end: i.to, text: i.content }));
        } 
        else if (file.name.endsWith('.vtt')) {
            let blocks = text.split(/\n\s*\n/);
            blocks.forEach(block => {
                let lines = block.split('\n');
                let timeLine = lines.find(l => l.includes('-->'));
                if(timeLine) {
                    let parts = timeLine.split('-->');
                    let start = parseTime(parts[0]);
                    let end = parseTime(parts[1]);
                    let content = lines.slice(lines.indexOf(timeLine)+1).join(' ');
                    if(content.trim()) subtitles.push({start, end, text: content.trim()});
                }
            });
        }
        else if (file.name.endsWith('.lrc')) {
            let lines = text.split('\n');
            let lrcRegex = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/;
            lines.forEach((line) => {
                let match = line.match(lrcRegex);
                if(match && match[3].trim()) {
                    let start = parseInt(match[1]) * 60 + parseFloat(match[2]);
                    subtitles.push({start, text: match[3].trim()});
                }
            });
            // LRC 格式补全结束时间
            for(let i=0; i<subtitles.length; i++) {
                subtitles[i].end = (i < subtitles.length - 1) ? subtitles[i+1].start : subtitles[i].start + 5;
            }
        }
        
        subtitles.sort((a,b) => a.start - b.start);
        syncSubIndex();
        alert("字幕解析成功，已开启TTS朗读模式。");
    });

    function parseTime(timeStr) {
        let parts = timeStr.trim().split(':');
        if(parts.length === 3) return parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseFloat(parts[2]);
        if(parts.length === 2) return parseInt(parts[0])*60 + parseFloat(parts[1]);
        return 0;
    }

    // 拖拽进度条后，同步当前时间的字幕索引
    function syncSubIndex() {
        if(!subtitles.length) return;
        nextSubIndex = subtitles.length;
        for(let i=0; i<subtitles.length; i++) {
            subtitles[i].ttsDone = false; // 重置 TTS 状态
            if(media.currentTime < subtitles[i].end && nextSubIndex === subtitles.length) {
                nextSubIndex = i;
            }
        }
    }

    // 在播放过程中精准拦截，调用 TTS
    media.addEventListener('timeupdate', () => {
        if(!subtitles.length || nextSubIndex >= subtitles.length) return;
        
        let sub = subtitles[nextSubIndex];
        
        // 当视频进度触碰到或者进入当前字幕的开始时间时，暂停并朗读
        if (media.currentTime >= sub.start && media.currentTime < sub.end && !sub.ttsDone) {
            media.pause();
            if(isRhythmActive) rhythmAudio.pause();
            
            ttsIsSpeaking = true;
            let utterance = new SpeechSynthesisUtterance(sub.text);
            utterance.lang = 'zh-CN';
            utterance.rate = 1.2; // 稍快语速，防止卡顿
            
            utterance.onend = () => {
                ttsIsSpeaking = false;
                sub.ttsDone = true;
                // TTS读完后，如果此时有效播放窗口仍在运行，则恢复播放
                if (systemPlayTimer) {
                    media.play().catch(e=>{});
                    if(isRhythmActive) rhythmAudio.play();
                }
            };
            
            utterance.onerror = (e) => {
                console.error("TTS 错误: ", e);
                ttsIsSpeaking = false;
                sub.ttsDone = true;
                if(systemPlayTimer) media.play();
            };
            
            window.speechSynthesis.speak(utterance);
        }
        
        // 当前字幕播放完毕后，移动到下一个
        if (media.currentTime >= sub.end && sub.ttsDone) {
            nextSubIndex++;
        }
    });

    /* ================= 5. 音乐律动分析与乱跳引擎 ================= */
    
    document.getElementById('music-upload').addEventListener('change', (e) => {
        let file = e.target.files[0];
        if(!file) return;
        rhythmAudio.src = URL.createObjectURL(file);
        isRhythmActive = true;
    });

    function initAudioRhythm() {
        let AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        let source = audioCtx.createMediaElementSource(rhythmAudio);
        musicAnalyser = audioCtx.createAnalyser();
        musicAnalyser.fftSize = 256;
        source.connect(musicAnalyser);
        musicAnalyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(musicAnalyser.frequencyBinCount);
        
        if(audioCtx.state === 'suspended') audioCtx.resume();
        checkRhythmBeat();
    }

    function checkRhythmBeat() {
        requestAnimationFrame(checkRhythmBeat);
        if(!isRhythmActive || !musicAnalyser || rhythmAudio.paused) return;
        
        musicAnalyser.getByteFrequencyData(dataArray);
        // 检测低频(Bass/Kick)
        let sum = 0;
        for(let i = 0; i < 10; i++) sum += dataArray[i];
        let avg = sum / 10;
        
        let threshold = parseInt(document.getElementById('beat-threshold').value) || 200;
        
        if (avg > threshold && (Date.now() - lastJumpTime > 3000)) { // 3秒跳跃冷却时间
            lastJumpTime = Date.now();
            triggerBeatJump();
        }
    }

    function triggerBeatJump() {
        if(!media.duration) return;
        let startIgnore = (parseFloat(document.getElementById('ignore-start').value) || 0) * 60;
        let endIgnore = (parseFloat(document.getElementById('ignore-end').value) || 0) * 60;
        
        let minTime = startIgnore;
        let maxTime = media.duration - endIgnore;
        if(maxTime <= minTime) { minTime = 0; maxTime = media.duration; }
        
        let randTime = Math.random() * (maxTime - minTime) + minTime;
        media.currentTime = randTime;
        syncSubIndex(); // 跳跃后重置字幕状态

        // 全屏跳跃震动
        if (document.fullscreenElement) {
            container.classList.remove('shake-hit');
            void container.offsetWidth; // trigger reflow
            container.classList.add('shake-hit');
        }
    }
</script>
</body>
</html>
