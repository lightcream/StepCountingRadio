<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>STEPVISION · 步频放映室</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#22252e; --panel:#2b2f3b; --panel2:#262a35; --pit:#1b1e26;
  --dark:rgba(0,0,0,.55); --light:rgba(255,255,255,.05);
  --accent:#00e0ff; --accent-ink:#03242c;
  --text:#cfd8e6; --muted:#7c869e; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);overflow-x:hidden;
  font-family:"Rajdhani","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  padding:12px 12px 48px;min-height:100vh;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1040px;margin:0 auto}
.neu{background:var(--panel);border-radius:var(--radius);box-shadow:9px 11px 24px var(--dark),-7px -8px 18px var(--light)}

/* ============ 顶栏 ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;flex:none}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.12em;color:#e8f1fa;line-height:1;white-space:nowrap}
.brand h1 b{color:var(--accent)}
.brand span{font-size:10px;letter-spacing:.34em;color:var(--muted);margin-top:3px;display:block}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 10px;border-radius:9px;font-size:11.5px;font-weight:600;letter-spacing:.06em;background:var(--pit);color:var(--muted);box-shadow:inset 3px 3px 6px rgba(0,0,0,.6),inset -2px -2px 5px rgba(255,255,255,.05);white-space:nowrap}
.pill b{color:var(--text)}
.pill.warn{color:var(--accent)}
.pill.off{color:#e08c8c}
.pill::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#4a5163;margin-right:6px;vertical-align:1px}
.pill.on::before{background:var(--accent)}

/* ============ 播放器 ============ */
.player-shell{position:relative;width:100%;aspect-ratio:16/9;max-height:62vh;background:#0b0d12;border-radius:var(--radius);overflow:hidden;box-shadow:10px 12px 26px var(--dark),-8px -9px 20px var(--light);margin-bottom:12px}
.player-shell video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b0d12}
.player-shell.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}
.center-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);pointer-events:none;z-index:2;transition:opacity .4s}
.center-hint.off{opacity:0}
.center-hint svg{width:44px;height:44px;opacity:.5}
.center-hint p{font-size:14px;letter-spacing:.22em;color:#9aa5ba}
.center-hint span{font-size:11px;letter-spacing:.12em}
.audio-viz{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);display:none;gap:6px;align-items:flex-end;height:52px;pointer-events:none;z-index:2}
.player-shell[data-kind="audio"] .audio-viz{display:flex}
.audio-viz i{width:5px;border-radius:3px;background:var(--accent);opacity:.9;height:8px;animation:viz 1.05s ease-in-out infinite alternate;animation-play-state:paused}
.player-shell.playing .audio-viz i{animation-play-state:running}
.audio-viz i:nth-child(2){animation-delay:.13s}.audio-viz i:nth-child(3){animation-delay:.26s}
.audio-viz i:nth-child(4){animation-delay:.39s}.audio-viz i:nth-child(5){animation-delay:.52s}
.audio-viz i:nth-child(6){animation-delay:.65s}.audio-viz i:nth-child(7){animation-delay:.78s}
@keyframes viz{from{height:8px}to{height:48px}}
.subtitle-layer{position:absolute;left:50%;transform:translateX(-50%);bottom:11%;max-width:84%;padding:7px 17px;border-radius:10px;background:rgba(11,13,18,.74);backdrop-filter:blur(6px);color:#eaf6ff;font-size:clamp(13px,2.1vw,20px);font-weight:500;line-height:1.5;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3;border-left:3px solid var(--accent)}
.subtitle-layer.on{opacity:1}
.subtitle-layer.tts{border-left-color:#8ff0ff}
.subtitle-layer.tts::after{content:"TTS 朗读中";display:block;font-size:9px;letter-spacing:.3em;color:var(--accent);margin-top:2px}
.hearts-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
.heart{position:absolute;opacity:0;animation:rise 2.3s cubic-bezier(.2,.6,.3,1) forwards}
.heart svg{width:var(--s,24px);height:var(--s,24px);fill:var(--accent);filter:drop-shadow(0 0 7px rgba(0,224,255,.55))}
.heart.pale svg{fill:rgba(255,255,255,.85);filter:none}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.95}100%{transform:translate(var(--dx,0),-42vh) scale(1.18);opacity:0}}
.fs-status{position:absolute;top:12px;right:14px;z-index:5;display:none;padding:5px 12px;border-radius:9px;background:rgba(11,13,18,.55);backdrop-filter:blur(8px);font-size:12px;font-weight:600;letter-spacing:.08em;color:#bfe9f5;pointer-events:none}
.is-fs .fs-status{display:block}
.fs-status.warn{color:var(--accent)}
.fs-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(6,8,12,.6);opacity:0;pointer-events:none;transition:height .2s,opacity .3s;z-index:5;cursor:pointer;touch-action:none}
.is-fs .fs-progress{opacity:1;pointer-events:auto}
.fs-progress:hover{height:8px}
.fs-progress i{display:block;height:100%;width:0;background:var(--accent)}
.fs-progress.flash i{animation:fsflash .8s ease-out}
@keyframes fsflash{0%{background:#fff;box-shadow:0 0 18px 3px rgba(0,224,255,.95)}100%{background:var(--accent)}}
.control-layer{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;display:flex;align-items:center;gap:8px;padding:6px 9px;background:rgba(22,25,33,.74);backdrop-filter:blur(12px);border-radius:12px;transition:opacity .35s,transform .35s}
.is-fs .control-layer{opacity:0;transform:translateY(10px);pointer-events:none}
.is-fs .control-layer.show{opacity:1;transform:translateY(0);pointer-events:auto}
.player-shell.hidecursor{cursor:none}
.cbtn{width:36px;height:36px;flex:none;border:none;border-radius:50%;cursor:pointer;background:var(--panel2);color:#dfe9f4;display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 8px rgba(0,0,0,.5),-3px -3px 6px rgba(255,255,255,.08);transition:.16s}
.cbtn:hover{color:var(--accent)}
.cbtn:active{box-shadow:inset 3px 3px 6px rgba(0,0,0,.55),inset -2px -2px 4px rgba(255,255,255,.05);transform:scale(.94)}
.cbtn svg{width:16px;height:16px}
.cbtn.accent{background:var(--accent);color:var(--accent-ink)}
.time-label{font-size:12px;font-weight:600;letter-spacing:.04em;color:#aeb9cc;white-space:nowrap;font-variant-numeric:tabular-nums}
.time-label b{color:var(--accent);margin-left:7px;font-weight:600}
.pbar{flex:1;height:20px;display:flex;align-items:center;position:relative;cursor:pointer;touch-action:none}
.pbar .track{position:absolute;left:0;right:0;height:6px;border-radius:5px;background:var(--pit);box-shadow:inset 2px 2px 5px rgba(0,0,0,.65),inset -1px -1px 3px rgba(255,255,255,.05)}
.pbar .fill{position:absolute;left:0;height:6px;border-radius:5px;background:var(--accent);width:0}
.pbar .fill::after{content:'';position:absolute;right:-4px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(0,224,255,.65)}
.bubble{position:absolute;bottom:24px;transform:translateX(-50%);padding:2px 8px;border-radius:7px;background:rgba(11,13,18,.9);color:#dff6ff;font-size:11px;font-weight:600;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .15s;font-variant-numeric:tabular-nums}
.pbar.drag .bubble{opacity:1}
.vol-group{display:flex;align-items:center;gap:5px}
.vol-group input[type=range]{width:72px}
@media (max-width:760px){.vol-group{display:none}.time-label{font-size:10.5px}}

/* ============ 工作台 ============ */
.dock{padding:11px}
.dock-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.up-tile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--pit);cursor:pointer;transition:.16s;box-shadow:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 5px rgba(255,255,255,.04);min-width:0}
.up-tile:hover{box-shadow:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 5px rgba(255,255,255,.04),0 0 0 1px rgba(0,224,255,.3)}
.up-tile:active{transform:translateY(1px)}
.uic{width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:#232835}
.uic svg{width:15px;height:15px}
.up-tile>div{min-width:0}
.up-tile strong{display:block;font-size:12.5px;letter-spacing:.05em;color:#dfe9f4;white-space:nowrap}
.up-tile em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-tile em.ok{color:#9fd8e6}
.up-tile input{display:none}
.dock-sep{height:1px;background:rgba(255,255,255,.05);margin:11px 2px 9px}
.pl-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px}
.pl-head h3{font-size:12px;letter-spacing:.2em;color:#aeb9cc;font-weight:600}
.pl-head .pl-count{font-size:11.5px;color:var(--muted)}
.pl-head .pl-shuf{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.pl-head .pl-shuf.on{color:var(--accent)}
.pl-head .pl-shuf svg{width:13px;height:13px}
.playlist{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;scrollbar-width:thin;scrollbar-color:#3a4152 transparent}
.playlist::-webkit-scrollbar{height:5px}
.playlist::-webkit-scrollbar-thumb{background:#3a4152;border-radius:4px}
.pl-empty{padding:10px 4px;font-size:11.5px;color:var(--muted);letter-spacing:.1em}
.pl-item{position:relative;min-width:172px;max-width:214px;flex:1;display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;cursor:pointer;background:var(--pit);transition:.18s;box-shadow:inset 3px 3px 6px rgba(0,0,0,.5),inset -2px -2px 4px rgba(255,255,255,.04)}
.pl-item:hover{box-shadow:inset 3px 3px 6px rgba(0,0,0,.5),inset -2px -2px 4px rgba(255,255,255,.04),0 0 0 1px rgba(0,224,255,.28)}
.pl-item.active{box-shadow:inset 3px 3px 6px rgba(0,0,0,.5),inset -2px -2px 4px rgba(255,255,255,.04),0 0 0 1.5px var(--accent)}
.pl-item.active::before{content:'';position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--accent)}
.pl-idx{font-size:13px;font-weight:700;color:#4d566b;flex:none;font-variant-numeric:tabular-nums}
.pl-item.active .pl-idx{color:var(--accent)}
.pl-meta{min-width:0;flex:1}
.pl-meta strong{display:block;font-size:12px;color:#d7e1ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pl-meta span{display:block;font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap}
.pl-x{width:24px;height:24px;flex:none;border:none;background:transparent;color:#5b6478;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.14s}
.pl-x:hover{color:#ff8f8f;background:rgba(255,110,110,.12)}
.pl-x svg{width:11px;height:11px}

/* ============ 通用控件 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border:none;border-radius:10px;cursor:pointer;background:var(--panel2);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.04em;box-shadow:4px 5px 10px var(--dark),-3px -4px 8px var(--light);transition:.16s}
.btn:hover{filter:brightness(1.1)}
.btn:active{box-shadow:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 5px rgba(255,255,255,.04);transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none}
.btn.accent{background:var(--accent);color:var(--accent-ink);box-shadow:4px 5px 11px rgba(0,0,0,.45),-3px -4px 9px rgba(255,255,255,.14),inset 1px 1px 0 rgba(255,255,255,.4)}
.btn.wide{width:100%}
.btn svg{width:14px;height:14px}
input[type=number]{background:var(--pit);border:none;color:var(--text);border-radius:9px;padding:7px 6px;width:100%;font-family:inherit;font-size:13px;font-weight:600;text-align:center;box-shadow:inset 3px 3px 7px rgba(0,0,0,.55),inset -2px -2px 5px rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
input[type=number]:focus{outline:1.5px solid rgba(0,224,255,.45)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:22px;cursor:pointer;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:5px;background:var(--pit);box-shadow:inset 2px 2px 5px rgba(0,0,0,.65),inset -1px -1px 3px rgba(255,255,255,.05)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;margin-top:-5px;border-radius:50%;background:var(--accent);border:none;box-shadow:3px 3px 7px rgba(0,0,0,.5),-2px -2px 5px rgba(255,255,255,.2)}
input[type=range]::-moz-range-track{height:7px;border-radius:5px;background:var(--pit);box-shadow:inset 2px 2px 5px rgba(0,0,0,.65)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--accent);border:none;box-shadow:3px 3px 7px rgba(0,0,0,.5)}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{display:none}
.sw-track{width:38px;height:21px;border-radius:11px;background:var(--pit);position:relative;flex:none;transition:.22s;box-shadow:inset 3px 3px 6px rgba(0,0,0,.6),inset -2px -2px 4px rgba(255,255,255,.05)}
.sw-track i{position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#5a647e;transition:.22s;box-shadow:2px 2px 4px rgba(0,0,0,.5)}
.switch input:checked+.sw-track{background:rgba(0,224,255,.16)}
.switch input:checked+.sw-track i{left:20px;background:var(--accent)}
.switch em{font-style:normal;color:var(--muted);font-size:12px}
.switch input:checked~em{color:#9fd8e6}

/* ============ 设置抽屉 + 底栏面板开关 ============ */
.settings-panel{position:fixed;left:8px;right:8px;bottom:4px;z-index:70;max-height:min(56vh,470px);display:flex;flex-direction:column;border-radius:var(--radius);background:var(--panel);transform:translateY(calc(100% + 14px));transition:transform .4s cubic-bezier(.22,.9,.32,1);box-shadow:10px 12px 28px rgba(0,0,0,.6),-8px -8px 20px var(--light)}
.settings-panel.open{transform:translateY(0)}
.sp-head{display:flex;align-items:center;gap:12px;padding:10px 16px 6px;flex:none}
.sp-grip{width:40px;height:4px;border-radius:3px;background:#41495c;flex:none}
.sp-head h2{font-size:12px;letter-spacing:.3em;color:#aeb9cc;font-weight:600;flex:1}
.sp-body{overflow-y:auto;padding:2px 16px 16px;scrollbar-width:thin;scrollbar-color:#3a4152 transparent}
.sp-body::-webkit-scrollbar{width:5px}
.sp-body::-webkit-scrollbar-thumb{background:#3a4152;border-radius:4px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:11px}
.card{background:var(--panel2);border-radius:12px;padding:12px;box-shadow:4px 5px 11px rgba(0,0,0,.38),-3px -4px 9px rgba(255,255,255,.035)}
.card h3{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.22em;color:#aeb9cc;font-weight:600;margin-bottom:10px}
.card h3 svg{width:13px;height:13px;color:var(--accent);flex:none}
.f-col{display:flex;flex-direction:column;gap:5px;margin:7px 0}
.f-col>label{font-size:11px;color:var(--muted);letter-spacing:.05em}
.f-row{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:8px 0}
.f-row>label{font-size:11.5px;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:7px 0}
.duo>div{display:flex;flex-direction:column;gap:5px}
.duo label{font-size:11px;color:var(--muted);letter-spacing:.05em}
.row-btn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.state-line{font-size:11.5px;color:var(--muted);padding:7px 10px;border-radius:9px;background:var(--pit);box-shadow:inset 3px 3px 6px rgba(0,0,0,.5),inset -2px -2px 4px rgba(255,255,255,.04);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state-line b{color:#9fd8e6;font-weight:600}
.mini-hint{font-size:10.5px;line-height:1.6;color:#68718a;margin-top:8px}
.ratelabel{font-size:12px;color:var(--accent);font-weight:700;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.panel-switch{
  position:fixed;left:50%;bottom:4px;transform:translateX(-50%);z-index:82;
  display:flex;align-items:center;gap:9px;padding:8px 18px 8px 15px;border:none;cursor:pointer;
  border-radius:11px 11px 0 0;background:var(--panel);color:var(--muted);
  font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.24em;
  box-shadow:0 -5px 14px rgba(0,0,0,.5),-4px -3px 10px var(--light);transition:.25s;
}
.panel-switch:hover{color:var(--accent)}
.panel-switch .bar{width:22px;height:3px;border-radius:2px;background:#41495c}
.panel-switch svg{width:12px;height:12px}
.panel-switch.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(120%)}

/* ============ mini 进度条 / toast ============ */
.mini-progress{position:fixed;left:0;right:0;bottom:0;height:4px;z-index:80;background:rgba(8,10,15,.75);cursor:pointer;touch-action:none;transition:height .15s}
.mini-progress::before{content:'';position:absolute;top:-8px;left:0;right:0;height:14px}
.mini-progress:hover{height:8px}
.mini-progress i{display:block;height:100%;width:0;background:var(--accent)}
.toast-wrap{position:fixed;right:12px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:none}
.toast{background:rgba(36,40,51,.94);color:var(--text);padding:9px 14px;border-radius:11px;max-width:min(80vw,400px);font-size:12.5px;font-weight:500;letter-spacing:.03em;opacity:0;transform:translateY(10px);transition:.3s;box-shadow:6px 8px 16px rgba(0,0,0,.5),-4px -4px 9px rgba(255,255,255,.04);border-left:3px solid var(--accent)}
.toast.in{opacity:1;transform:none}
.toast.dim{border-left-color:#4a5163;color:var(--muted)}

@media (max-width:760px){
  body{padding:9px 8px 44px}
  .brand h1{font-size:15px}
  .settings-grid{grid-template-columns:1fr}
  .duo{gap:7px}
  .panel-switch{padding:7px 14px 7px 12px;letter-spacing:.18em}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 44 44">
        <circle cx="3.5" cy="40.5" r="2.8" fill="#00e0ff"/>
        <circle cx="9" cy="34" r="2.8" fill="#00e0ff" opacity=".55"/>
        <circle cx="14.5" cy="27.5" r="2.8" fill="#00e0ff" opacity=".28"/>
        <circle cx="27" cy="19" r="15" fill="#00e0ff"/>
        <path d="M24.5 13v12l9.5-6z" fill="#03242c"/>
      </svg>
      <div><h1>STEP<b>VISION</b></h1><span>步频放映室</span></div>
    </div>
    <div class="pills">
      <div class="pill" id="pillQuota">已锁定 · 未开启计步</div>
      <div class="pill" id="pillSteps">步数 <b>0</b></div>
      <div class="pill" id="pillSub">字幕</div>
      <div class="pill" id="pillBeat">律动</div>
    </div>
  </header>

  <!-- 播放器 -->
  <section class="player-shell" id="playerShell" data-kind="video">
    <video id="video" playsinline webkit-playsinline preload="auto"></video>
    <div class="center-hint" id="centerHint">

<footer class="settings-panel" id="settingsPanel">
  <div class="sp-head"><span class="sp-grip"></span><h2>控制台</h2><button class="btn" id="spClose" style="padding:6px 12px">收起</button></div>
  <div class="sp-body">
    <div class="settings-grid">

      <div class="card">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7 4.5 14 2.5-7H21"/></svg>步数引擎</h3>

<div class="mini-progress" id="miniBar"><i id="miniFill"></i></div>
<div class="toast-wrap" id="toastWrap"></div>
<audio id="musicAudio" loop hidden></audio>

<script>
'use strict';
/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(t){ if(!isFinite(t))return'--:--'; t=Math.max(0,Math.floor(t)); const h=(t/3600)|0,m=((t%3600)/60)|0,s=t%60,p=n=>String(n).padStart(2,'0'); return h?h+':'+p(m)+':'+p(s):p(m)+':'+p(s); }
function fmtBytes(b){ if(!isFinite(b))return'--'; const u=['B','KB','MB','GB','TB']; let i=0; while(b>=1024&&i<4){b/=1024;i++} return (b>=100||i===0?Math.round(b):b.toFixed(1))+' '+u[i]; }

const SVG_PLAY='<svg viewBox="0 0 24 24"><path d="M7.5 4.5v15l13-7.5z" fill="currentColor"/></svg>';
const SVG_PAUSE='<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/></svg>';
const SVG_FS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const SVG_VOL='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const SVG_MUTE='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const SVG_HEART='<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
const SVG_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>';

/* ============ 元素 ============ */
const video=$('video'), playerShell=$('playerShell'), controlLayer=$('controlLayer'),
  subLayer=$('subLayer'), heartsLayer=$('heartsLayer'), centerHint=$('centerHint'),
  mainBar=$('mainBar'), mainFill=$('mainFill'), bubble=$('bubble'),
  miniBar=$('miniBar'), miniFill=$('miniFill'), fsBar=$('fsBar'), fsFill=$('fsFill'),
  btnPlay=$('btnPlay'), btnFs=$('btnFs'), btnMute=$('btnMute'),
  timeText=$('timeText'), rateBadge=$('rateBadge'),
  volRange=$('volRange'), volRange2=$('volRange2'),
  playlist=$('playlist'), playlistWrap=$('playlistWrap'), plCount=$('plCount'), plShufBadge=$('plShufBadge'),
  settingsPanel=$('settingsPanel'), panelSwitch=$('panelSwitch'),
  musicAudio=$('musicAudio'), toastWrap=$('toastWrap'),
  fsStatus=$('fsStatus'), pillQuota=$('pillQuota'), pillSteps=$('pillSteps'), pillSub=$('pillSub'), pillBeat=$('pillBeat');

btnPlay.innerHTML=SVG_PLAY; btnFs.innerHTML=SVG_FS; btnMute.innerHTML=SVG_VOL;

/* ============ 状态 ============ */
const S={ rate:1, volume:1, stepSec:30, settleSec:5, beatSens:1.6, beatCooldown:2, headMin:0, tailMin:0, musicVol:0.7, shuffle:false };
try{ Object.assign(S, JSON.parse(localStorage.getItem('stepvision')||'{}')); }catch(e){}
function persist(){ try{ localStorage.setItem('stepvision', JSON.stringify(S)); }catch(e){} }

let playlistArr=[], currentIndex=-1, pendingSeek=null;
let stepMode=false, steps=0, quota=0, quotaToastShown=false;
let cues=[], subIdx=0, lastSubText=null;
let ttsState='idle', ttsCancelRef=null;
let shuffle=S.shuffle;
let beatOn=false, musicUrl=null, musicName='', jumpCount=0, lastJump=0, beatAvg=0.05;
let audioCtx=null, musicAnalyser=null, musicGain=null, freqData=null;
let barDragging=false, previewRatio=0, hideTimer=0;

/* ============ Toast ============ */
function toast(msg,type=''){
  while(toastWrap.children.length>=3) toastWrap.firstChild.remove();
  const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg;
  toastWrap.appendChild(el); requestAnimationFrame(()=>el.classList.add('in'));
  setTimeout(()=>{ el.classList.remove('in'); setTimeout(()=>el.remove(),320); },2600);
}

/* ============ 媒体 ============ */
function isAudioFile(f){ return (f.type&&f.type.startsWith('audio'))||/\.(mp3|flac|wav|aac|ogg|m4a|opus|wma|aiff|caf)$/i.test(f.name); }
function addMediaFiles(files){
  const ok=files.filter(f=>/\.(mp4|mkv|webm|mov|avi|flv|wmv|ts|m2ts|m4v|mpg|mpeg|3gp|ogv|mp3|flac|wav|aac|ogg|m4a|opus|wma)$/i.test(f.name)||(f.type&&(f.type.startsWith('video')||f.type.startsWith('audio'))));
  if(!ok.length){ toast('未识别到音视频文件'); return; }
  for(const f of ok){
    const item={ name:f.name, size:f.size, url:URL.createObjectURL(f), duration:null, kind:isAudioFile(f)?'audio':'video' };
    playlistArr.push(item); probeDuration(item);
  }
  $('slotMediaInfo').textContent=`共 ${playlistArr.length} 个 · ${ok[ok.length-1].name}`;
  $('slotMediaInfo').classList.add('ok');
  if(currentIndex<0) loadIndex(0,true); else { renderPlaylist(); toast(`已加入 ${ok.length} 个文件`); }
}
function probeDuration(item){
  const v=document.createElement('video'); v.preload='metadata'; v.muted=true; v.src=item.url;
  const done=()=>{ if(v.duration&&isFinite(v.duration)) item.duration=v.duration; v.onloadedmetadata=v.onerror=null; v.removeAttribute('src'); v.load(); renderPlaylist(); };
  v.onloadedmetadata=done; v.onerror=done;
}
 $('slotMediaInput').addEventListener('change',e=>{ addMediaFiles([...e.target.files]); e.target.value=''; });
['dragover','dragleave','drop'].forEach(ev=>playerShell.addEventListener(ev,e=>{ e.preventDefault();
  if(ev==='drop'&&e.dataTransfer.files.length) addMediaFiles([...e.dataTransfer.files]); }));

function loadIndex(i,autoplay,seekTo){
  if(i<0||i>=playlistArr.length) return;
  currentIndex=i; const it=playlistArr[i];
  cancelTTS();
  pendingSeek=(seekTo!=null)?seekTo:null;
  video.src=it.url; applyRate(); applyVolume();
  playerShell.dataset.kind=it.kind;
  subIdx=0; if(cues.length) cues.forEach(c=>c.done=false);
  renderPlaylist();
  if(autoplay===true) tryPlay();
}
function tryPlay(){
  if(!playlistArr.length){ toast('请先上传媒体文件'); return false; }
  if(!stepMode){ toast('视频已锁定 · 请先开启计步传感器'); return false; } // 未开启传感器一律不可播放
  if(quota<=0){ toast('本段播放时间已用尽 · 计步或点预热解锁'); return false; }
  video.play().catch(()=>{});
  return true;
}
function togglePlay(){
  if(!playlistArr.length){ toast('请先上传媒体文件'); return; }
  if(ttsState==='speaking'){ cancelTTS(); return; }
  if(video.paused) tryPlay(); else video.pause();
}
function next(){
  if(playlistArr.length<=1){ video.currentTime=0; tryPlay(); return; }
  let n=currentIndex;
  if(shuffle){ do{ n=Math.floor(Math.random()*playlistArr.length); }while(n===currentIndex); }
  else n=(currentIndex+1)%playlistArr.length;
  loadIndex(n,true);
}
function removeItem(i){
  const it=playlistArr[i]; URL.revokeObjectURL(it.url);
  playlistArr.splice(i,1);
  if(!playlistArr.length){
    video.pause(); video.removeAttribute('src'); video.load(); currentIndex=-1;
    renderPlaylist(); toast('列表已清空'); return;
  }
  if(i===currentIndex){ const old=currentIndex; currentIndex=-1; loadIndex(Math.min(old,playlistArr.length-1), quota>0); }
  else if(i<currentIndex) currentIndex--;
  renderPlaylist(); toast(`已移除「${it.name}」`);
}
function renderPlaylist(){
  plCount.textContent=playlistArr.length+' 项';
  plShufBadge.classList.toggle('on',shuffle);
  centerHint.classList.toggle('off',playlistArr.length>0);
  if(!playlistArr.length){ playlist.innerHTML='<div class="pl-empty">列表为空 · 上传媒体后自动加入</div>'; return; }
  playlist.innerHTML=playlistArr.map((it,i)=>`
    <div class="pl-item ${i===currentIndex?'active':''}" data-i="${i}">
      <span class="pl-idx">${String(i+1).padStart(2,'0')}</span>
      <div class="pl-meta"><strong title="${esc(it.name)}">${esc(it.name)}</strong>
        <span>${it.duration?fmt(it.duration):'读取中…'} · ${fmtBytes(it.size)} · ${it.kind==='audio'?'音频':'视频'}</span></div>
      <button class="pl-x" data-x="${i}" title="移除">${SVG_X}</button>
    </div>`).join('');
}
playlistWrap.addEventListener('click',e=>{
  const x=e.target.closest('.pl-x'); if(x){ e.stopPropagation(); removeItem(+x.dataset.x); return; }
  const item=e.target.closest('.pl-item'); if(item) loadIndex(+item.dataset.i,true);
});

/* ============ 倍速 / 音量 ============ */
function applyRate(){ try{ video.playbackRate=S.rate; }catch(e){} }
function applyVolume(){ video.volume=S.volume; btnMute.innerHTML=(video.muted||video.volume===0)?SVG_MUTE:SVG_VOL; }
function setRate(r,src){
  r=Math.min(4,Math.max(0.1,Math.round(r*100)/100)); S.rate=r; persist(); applyRate();
  if(src!==$('rateRange')) $('rateRange').value=r;
  if(src!==$('rateNum')) $('rateNum').value=r.toFixed(2);
  $('rateLabel').textContent='×'+r.toFixed(2);
  rateBadge.textContent='×'+r.toFixed(2); rateBadge.style.display=r!==1?'inline':'none';
}
 $('rateRange').addEventListener('input',e=>setRate(+e.target.value,e.target));
 $('rateNum').addEventListener('change',e=>setRate(+e.target.value||1,e.target));
function setVolume(v,src){
  v=Math.min(1,Math.max(0,v)); S.volume=v; video.volume=v; video.muted=(v===0); persist();
  if(src!==volRange) volRange.value=v;
  if(src!==volRange2) volRange2.value=v;
  btnMute.innerHTML=(v===0)?SVG_MUTE:SVG_VOL;
}
volRange.addEventListener('input',e=>setVolume(+e.target.value,e.target));
volRange2.addEventListener('input',e=>setVolume(+e.target.value,e.target));
btnMute.addEventListener('click',()=>{ video.muted=!video.muted; if(!video.muted&&video.volume===0) setVolume(.6); btnMute.innerHTML=video.muted?SVG_MUTE:SVG_VOL; });

video.addEventListener('loadedmetadata',()=>{
  applyRate(); applyVolume();
  const it=playlistArr[currentIndex]; if(it&&it.duration==null&&isFinite(video.duration)) it.duration=video.duration;
  if(pendingSeek!=null){ const t=pendingSeek; pendingSeek=null; seekMedia(t); }
  renderPlaylist();
});
video.addEventListener('play',()=>{ playerShell.classList.add('playing'); btnPlay.innerHTML=SVG_PAUSE; quotaToastShown=false; });
video.addEventListener('pause',()=>{ playerShell.classList.remove('playing'); btnPlay.innerHTML=SVG_PLAY; });
video.addEventListener('ended',next);
video.addEventListener('error',()=>{ if(video.currentSrc) toast('浏览器无法解码该文件 · 建议用 Chrome / Edge','dim'); });
btnPlay.addEventListener('click',togglePlay);

/* ============ 统一 seek ============ */
function seekMedia(t){
  if(!isFinite(t)||!video.duration) return;
  video.currentTime=Math.max(0,Math.min(t,video.duration-0.05));
  subIdx=0;
  if(cues.length) cues.forEach(c=>c.done=c.from<video.currentTime-0.05);
  setSubtitleText('');
  updateProgressUI(true);
}

/* ============ 三条进度条 ============ */
function makeBar(barEl,fillEl,preview){
  let drag=false;
  const ratioAt=e=>{ const r=barEl.getBoundingClientRect(); return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); };
  barEl.addEventListener('pointerdown',e=>{
    if(!video.duration) return; drag=true; barDragging=true;
    barEl.classList.add('drag'); barEl.setPointerCapture(e.pointerId);
    previewRatio=ratioAt(e); fillEl.style.width=previewRatio*100+'%';
    if(preview) preview(previewRatio,e);
  });
  barEl.addEventListener('pointermove',e=>{
    if(!drag) return;
    previewRatio=ratioAt(e); fillEl.style.width=previewRatio*100+'%';
    if(preview) preview(previewRatio,e);
  });
  const up=e=>{
    if(!drag) return; drag=false; barDragging=false; barEl.classList.remove('drag');
    cancelTTS(); seekMedia(ratioAt(e)*video.duration);
  };
  barEl.addEventListener('pointerup',up); barEl.addEventListener('pointercancel',up);
}
makeBar(mainBar,mainFill,(r,e)=>{ bubble.textContent=fmt(r*(video.duration||0)); bubble.style.left=(r*100)+'%'; });
makeBar(miniBar,miniFill,null);
makeBar(fsBar,fsFill,null);

let lastW='', lastLabel='';
function updateProgressUI(force){
  const d=video.duration||0, t=video.currentTime||0;
  const r=barDragging?previewRatio:(d?t/d:0);
  const w=(r*100).toFixed(2)+'%';
  if(w!==lastW){ lastW=w; mainFill.style.width=w; miniFill.style.width=w; fsFill.style.width=w; }
  const lab=(barDragging?fmt(previewRatio*d):fmt(t))+' / '+fmt(d);
  if(force||lab!==lastLabel){ lastLabel=lab; timeText.textContent=lab; }
}

/* ============ 计步传感器（未开启 = 视频锁定） ============ */
let motionAvg=9.8, motionPeak=false, lastStepAt=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a) return;
  const mag=Math.hypot(a.x||0,a.y||0,a.z||0);
  motionAvg=motionAvg*0.92+mag*0.08;
  const raw=mag-motionAvg, now=performance.now();
  if(!motionPeak){ if(raw>2.2) motionPeak=true; }
  else if(raw<-1.1){ motionPeak=false; if(now-lastStepAt>320){ lastStepAt=now; onStep(); } }
}
async function toggleSensor(){
  if(stepMode){ // 关闭传感器 → 立即暂停并重新锁定
    window.removeEventListener('devicemotion',onMotion); stepMode=false;
    video.pause(); quota=0;
    $('btnSensor').textContent='开启计步传感器';
    $('sensorState').textContent='传感器：未开启 · 视频已锁定';
    toast('传感器已关闭 · 视频锁定'); updateStatusPills(); return;
  }
  if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
    try{ const p=await DeviceMotionEvent.requestPermission(); if(p!=='granted'){ toast('传感器权限被拒绝'); return; } }
    catch(err){ toast('权限请求失败'); return; }
  }else if(!('ondevicemotion' in window)){ toast('此设备无运动传感器 · 可用「模拟一步」或 S 键','dim'); }
  window.addEventListener('devicemotion',onMotion); stepMode=true; quotaToastShown=false;
  $('btnSensor').textContent='传感器运行中 · 点击关闭';
  $('sensorState').innerHTML='传感器：<b>运行中</b> · 每步 '+S.stepSec+'s · 提前量 '+S.settleSec+'s';
  toast('计步已开启 · 视频解锁 · 每步 '+S.stepSec+' 秒'); updateStatusPills();
}
 $('btnSensor').addEventListener('click',toggleSensor);
 $('btnSimStep').addEventListener('click',()=>onStep());
 $('btnWarm').addEventListener('click',()=>{
  if(!stepMode){ toast('请先开启计步传感器 · 再用预热解锁'); return; }
  cancelTTS(); quota=135; quotaToastShown=false;
  if(video.ended) next(); else tryPlay();
  toast('预热完成 · 播放 2:15');
});
function onStep(){
  steps++; spawnHeart(); updateStatusPills();
  if(!stepMode) return;
  if(quota<=S.settleSec){ // 结算窗口内或时间已结束才激活，整段重置、不叠加
    quota=S.stepSec;
    if(video.ended) next(); else if(video.paused) tryPlay();
    toast(`步数触发 · 解锁新一段 ${S.stepSec}s`);
  }else{
    toast(`已计步 · 剩余 ${fmt(quota)}，进入最后 ${S.settleSec}s 后生效`,'dim');
  }
}

/* ============ 字幕 + TTS ============ */
function parseSubtitle(text){
  const t=text.replace(/^\uFEFF/,'').trim();
  if(t.startsWith('[')){
    try{ const j=JSON.parse(t); if(Array.isArray(j)&&j[0]&&'from'in j[0])
      return j.filter(c=>c&&c.content).map(c=>({from:+c.from,to:+c.to,content:String(c.content)})); }catch(e){}
    return parseLRC(t);
  }
  if(t.includes('-->')||/^WEBVTT/i.test(t)) return parseVTT(t);
  return parseLRC(t);
}
function parseLRC(text){
  const rows=[];
  for(const line of text.split(/\r?\n/)){
    const tags=[...line.matchAll(/\[(\d{1,2}):(\d{1,2}(?:\.\d{1,3})?)\]/g)];
    if(!tags.length) continue;
    const content=line.replace(/\[[^\]]*\]/g,'').trim();
    for(const tg of tags) rows.push({from:(+tg[1])*60+(+tg[2]),content});
  }
  rows.sort((a,b)=>a.from-b.from);
  return rows.map((r,i)=>({from:r.from,to:rows[i+1]?rows[i+1].from:r.from+8,content:r.content})).filter(r=>r.content);
}
function parseVT(s){ const m=s.match(/(?:(\d+):)?(\d{1,2}):(\d{1,2})[.,](\d{1,3})/); return m?(+m[1]||0)*3600+(+m[2])*60+(+m[3])+(+m[4].padEnd(3,'0'))/1000:NaN; }
function parseVTT(text){
  const out=[];
  for(const block of text.split(/\n\s*\n/)){
    const lines=block.split('\n').filter(l=>l.trim()!=='');
    const ti=lines.findIndex(l=>l.includes('-->'));
    if(ti<0) continue;
    const [a,b]=lines[ti].split('-->');
    const from=parseVT(a.trim()), to=parseVT(b.trim().split(/\s+/)[0]);
    const content=lines.slice(ti+1).join(' ').replace(/<[^>]+>/g,'').trim();
    if(isFinite(from)&&isFinite(to)&&content) out.push({from,to,content});
  }
  return out.sort((x,y)=>x.from-y.from);
}
function loadSubtitleFile(f){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const cs=parseSubtitle(String(r.result));
      if(!cs.length) throw 0;
      cs.forEach(c=>{ c.to=Math.max(c.to,c.from+0.2); c.done=false; });
      cs.sort((a,b)=>a.from-b.from);
      cues=cs; subIdx=0; cancelTTS();
      $('subInfo').textContent=`${f.name} · ${cs.length} 段`; $('subInfo').classList.add('ok');
      $('subState').innerHTML=`<b>${esc(f.name)}</b> · ${cs.length} 段`;
      $('subRemove').disabled=false;
      toast(`字幕轨已加载 · ${cs.length} 段`); updateStatusPills();
    }catch(e){ toast('字幕解析失败 · 请检查 JSON / LRC / VTT 格式'); }
  };
  r.readAsText(f);
}
 $('slotSubInput').addEventListener('change',e=>{ if(e.target.files[0]) loadSubtitleFile(e.target.files[0]); e.target.value=''; });
 $('subRePick').addEventListener('click',()=>$('slotSubInput').click());
 $('subRemove').addEventListener('click',()=>{
  cues=[]; subIdx=0; cancelTTS(); setSubtitleText('');
  $('subInfo').textContent='JSON / LRC / VTT'; $('subInfo').classList.remove('ok');
  $('subState').textContent='未加载 · 原文连续播放'; $('subRemove').disabled=true;
  toast('字幕已移除 · 功能解除'); updateStatusPills();
});
function setSubtitleText(s){ if(s===lastSubText) return; lastSubText=s; subLayer.textContent=s; subLayer.classList.toggle('on',!!s); }
function startTTS(c){
  ttsState='speaking'; video.pause();
  setSubtitleText(c.content); subLayer.classList.add('tts');
  let finished=false;
  const finish=resume=>{
    if(finished) return; finished=true; ttsState='idle'; clearTimeout(guard);
    subLayer.classList.remove('tts'); ttsCancelRef=null;
    if(resume){
      c.done=true; video.currentTime=c.from;
      subIdx=cues.indexOf(c);
      tryPlay();
    }
    setSubtitleText('');
  };
  ttsCancelRef=()=>finish(false);
  if(!('speechSynthesis' in window)){ finish(true); return; }
  const u=new SpeechSynthesisUtterance(c.content);
  u.lang='zh-CN'; u.rate=1;
  u.onend=()=>finish(true); u.onerror=()=>finish(true);
  try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }
  catch(e){ finish(true); return; }
  const guard=setTimeout(()=>finish(true),Math.max(2600,c.content.length*400));
}
function cancelTTS(){ if(ttsCancelRef) ttsCancelRef(); }
function subtitleTick(){
  const t=video.currentTime;
  if(ttsState==='speaking') return;
  while(subIdx<cues.length&&cues[subIdx].to<=t) subIdx++;
  if(subIdx>=cues.length){ setSubtitleText(''); return; }
  const c=cues[subIdx];
  if(!video.paused&&!c.done&&t>=c.from-0.02){ startTTS(c); return; }
  setSubtitleText(t>=c.from?c.content:'');
}

/* ============ 音乐律动 ============ */
function updMusicState(){
  $('musicState').innerHTML=musicUrl?`<b>${esc(musicName)}</b> · ${beatOn?'律动中':'已暂停'} · 跳跃 ${jumpCount} 次`:'未加载 · 律动关闭';
}
function ensureMusicGraph(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaElementSource(musicAudio);
    musicGain=audioCtx.createGain(); musicAnalyser=audioCtx.createAnalyser();
    musicAnalyser.fftSize=256; musicAnalyser.smoothingTimeConstant=0.5;
    freqData=new Uint8Array(musicAnalyser.frequencyBinCount);
    src.connect(musicGain); musicGain.connect(musicAnalyser); musicAnalyser.connect(audioCtx.destination);
  }
  audioCtx.resume();
}
function startBeat(){
  if(!musicAudio.src){ toast('请先上传音乐文件'); $('musicSwitch').checked=false; return; }
  ensureMusicGraph();
  musicGain.gain.value=S.musicVol; beatOn=true; $('musicSwitch').checked=true;
  musicAudio.play().catch(()=>toast('点击页面任意处以启动音乐','dim'));
  updMusicState(); updateStatusPills();
}
function stopBeat(){ musicAudio.pause(); beatOn=false; updMusicState(); updateStatusPills(); }
 $('musicSwitch').addEventListener('change',e=>e.target.checked?startBeat():stopBeat());
 $('slotMusicInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  if(musicUrl) URL.revokeObjectURL(musicUrl);
  musicUrl=URL.createObjectURL(f); musicName=f.name; musicAudio.src=musicUrl;
  $('musicInfo').textContent=f.name; $('musicInfo').classList.add('ok');
  $('musicRemove').disabled=false;
  startBeat(); toast('音乐已加载 · 律动开启');
  e.target.value='';
});
 $('musicRePick').addEventListener('click',()=>$('slotMusicInput').click());
 $('musicRemove').addEventListener('click',()=>{
  stopBeat(); $('musicSwitch').checked=false;
  musicAudio.removeAttribute('src'); musicAudio.load();
  if(musicUrl){ URL.revokeObjectURL(musicUrl); musicUrl=null; musicName=''; }
  $('musicInfo').textContent='按节奏随机跳转'; $('musicInfo').classList.remove('ok');
  updMusicState(); $('musicRemove').disabled=true;
  toast('音乐已移除 · 律动解除');
});
 $('musicVol').addEventListener('input',e=>{
  S.musicVol=+e.target.value; persist();
  if(musicGain) musicGain.gain.value=S.musicVol;
});
function beatTick(){
  if(!beatOn||!audioCtx||musicAudio.paused) return;
  musicAnalyser.getByteFrequencyData(freqData);
  let low=0; for(let i=0;i<5;i++) low+=freqData[i]; low/=(5*255);
  beatAvg=beatAvg*0.95+low*0.05;
  const now=performance.now();
  if(low>0.1&&low>beatAvg*S.beatSens&&now-lastJump>S.beatCooldown*1000){ lastJump=now; doJump(); }
}
function doJump(){
  const n=playlistArr.length; if(!n) return;
  const idx=n>1?Math.floor(Math.random()*n):currentIndex;
  const dur=(idx===currentIndex?video.duration:playlistArr[idx]?.duration);
  if(!isFinite(dur)||dur<=0){ toast('目标文件时长未知 · 本次未跳跃','dim'); return; }
  const head=S.headMin*60, tail=S.tailMin*60;
  let lo=head, hi=dur-tail-0.5;
  if(hi<=lo+0.5){
    if(head+tail>0){ toast('禁区覆盖了整个时长 · 本次未跳跃','dim'); return; }
    lo=0; hi=Math.max(dur-0.5,0);
  }
  const t=lo+Math.random()*(hi-lo);
  jumpCount++; updMusicState();
  jumpTo(idx,t);
}
function jumpTo(idx,t){
  const wasPlaying=!video.paused&&!video.ended;
  cancelTTS();
  if(idx!==currentIndex){ loadIndex(idx,false,t); if(wasPlaying) tryPlay(); }
  else seekMedia(t);
  if(playerShell.classList.contains('is-fs')){
    fsBar.classList.remove('flash'); void fsBar.offsetWidth; fsBar.classList.add('flash');
    playerShell.classList.remove('shake'); void playerShell.offsetWidth; playerShell.classList.add('shake');
  }
}

/* ============ 全屏 ============ */
async function toggleFs(){
  try{
    if(document.fullscreenElement){ await document.exitFullscreen(); }
    else if(playerShell.requestFullscreen){ await playerShell.requestFullscreen(); }
    else if(video.webkitEnterFullscreen){ video.webkitEnterFullscreen(); }
    else toast('此浏览器不支持全屏');
  }catch(e){ toast('无法进入全屏'); }
}
btnFs.addEventListener('click',toggleFs);
document.addEventListener('fullscreenchange',()=>{
  const fs=!!document.fullscreenElement;
  playerShell.classList.toggle('is-fs',fs);
  if(fs) pokeControls(); else { clearTimeout(hideTimer); controlLayer.classList.add('show'); playerShell.classList.remove('hidecursor'); }
});
function pokeControls(){
  controlLayer.classList.add('show'); playerShell.classList.remove('hidecursor');
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{
    if(playerShell.classList.contains('is-fs')&&!barDragging){
      controlLayer.classList.remove('show'); playerShell.classList.add('hidecursor');
    }
  },3000);
}
playerShell.addEventListener('pointermove',pokeControls);
playerShell.addEventListener('touchstart',pokeControls,{passive:true});
controlLayer.addEventListener('click',e=>e.stopPropagation());
controlLayer.addEventListener('dblclick',e=>e.stopPropagation());
fsBar.addEventListener('click',e=>e.stopPropagation());
fsBar.addEventListener('dblclick',e=>e.stopPropagation());

let clickTimer=null;
video.addEventListener('click',()=>{
  if(clickTimer) return;
  clickTimer=setTimeout(()=>{ clickTimer=null; togglePlay(); },240);
});
video.addEventListener('dblclick',()=>{ clearTimeout(clickTimer); clickTimer=null; toggleFs(); });

/* ============ 计步爱心 ============ */
function spawnHeart(){
  if(!playerShell.classList.contains('is-fs')) return;
  const h=document.createElement('div'); h.className='heart'+(Math.random()<0.4?' pale':'');
  h.style.left=(8+Math.random()*84)+'%';
  h.style.top=(40+Math.random()*38)+'%';
  h.style.setProperty('--s',(16+Math.random()*20)+'px');
  h.style.setProperty('--dx',((Math.random()-0.5)*90)+'px');
  h.innerHTML=SVG_HEART;
  heartsLayer.appendChild(h);
  setTimeout(()=>h.remove(),2500);
}

/* ============ 面板：底栏开关 + 控制台收起 ============ */
function togglePanel(){
  const open=settingsPanel.classList.toggle('open');
  panelSwitch.classList.toggle('hide',open);
  try{ localStorage.setItem('sv-panel',open?'1':'0'); }catch(e){}
}
panelSwitch.addEventListener('click',togglePanel);
 $('spClose').addEventListener('click',togglePanel);
if(localStorage.getItem('sv-panel')!=='0'){ settingsPanel.classList.add('open'); panelSwitch.classList.add('hide'); }

/* ============ 参数输入（冷却精确到两位小数） ============ */
function bindNum(id,key,min,max,round){
  const el=$(id); el.value=S[key];
  el.addEventListener('change',()=>{
    let v=parseFloat(el.value); if(!isFinite(v)) v=S[key];
    v=Math.min(max,Math.max(min,v)); if(round) v=Math.round(v*100)/100; // 两位小数
    S[key]=v; el.value=v; persist();
  });
}
bindNum('stepSec','stepSec',1,3600);
bindNum('settleSec','settleSec',0,600);
bindNum('beatSens','beatSens',1.1,3,true);
bindNum('beatCooldown','beatCooldown',0.01,30,true); // 冷却：0.01 秒起步，强制两位小数
bindNum('headMin','headMin',0,600);
bindNum('tailMin','tailMin',0,600);
 $('volRange2').value=S.volume; volRange.value=S.volume; $('musicVol').value=S.musicVol;
setRate(S.rate,null);
 $('shufSwitch').checked=shuffle;
 $('shufSwitch').addEventListener('change',e=>{ shuffle=S.shuffle=e.target.checked; persist(); renderPlaylist(); });

/* ============ 键盘 ============ */
window.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.key==='ArrowRight'){ cancelTTS(); seekMedia(video.currentTime+5); }
  else if(e.key==='ArrowLeft'){ cancelTTS(); seekMedia(video.currentTime-5); }
  else if(e.key==='s'||e.key==='S'){ onStep(); }
  else if(e.key==='f'||e.key==='F'){ toggleFs(); }
});

/* ============ 状态 ============ */
function updateStatusPills(){
  pillQuota.textContent=!stepMode?'已锁定 · 未开启计步':(quota>0?'剩余 '+fmt(quota):'已锁定 · 待计步');
  pillQuota.classList.toggle('off',!stepMode||(stepMode&&quota<=0));
  pillQuota.classList.toggle('warn',stepMode&&quota>0&&quota<=S.settleSec);
  pillSteps.innerHTML='步数 <b>'+steps+'</b>';
  pillSub.classList.toggle('on',cues.length>0);
  pillSub.textContent=cues.length?(ttsState==='speaking'?'朗读中':'字幕'):'字幕';
  pillBeat.classList.toggle('on',beatOn);
  fsStatus.textContent=(!stepMode?'锁定 · 待开启计步':(quota>0?'剩余 '+fmt(quota):'锁定 · 待计步'))+' · 步 '+steps;
  fsStatus.classList.toggle('warn',stepMode&&quota>0&&quota<=S.settleSec);
}

/* ============ 主循环 ============ */
let lastTs=performance.now(), lastText=0;
function loop(ts){
  const dt=Math.min(0.1,(ts-lastTs)/1000); lastTs=ts;
  if(stepMode&&!video.paused&&!video.ended&&ttsState!=='speaking'){
    if(quota>0){
      quota=Math.max(0,quota-dt);
      if(quota===0){ video.pause(); if(!quotaToastShown){ quotaToastShown=true; toast('本段播放时间结束 · 计步即可续播'); } }
    }
  }
  updateProgressUI();
  if(ts-lastText>250){ lastText=ts; updateStatusPills(); }
  subtitleTick();
  beatTick();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
renderPlaylist(); updateStatusPills(); updMusicState(); applyVolume();
</script>
