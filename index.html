<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8e949b" />
  <meta name="description" content="本地媒体 + 手机计步 + 字幕 TTS + 音乐律动播放器" />
  <title>Neon Step Media Player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="player-card neumorph-dark" id="playerCard">
      <div class="player-stage" id="playerStage">
        <video id="media" playsinline preload="metadata"></video>
        <div class="audio-poster" id="audioPoster" aria-hidden="true">
          <div class="audio-orb"></div>
          <div class="audio-caption">AUDIO</div>
        </div>
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">▶</div>
          <div class="empty-title">拖入媒体或点击上传</div>
          <div class="empty-sub">支持本地视频 / 音频，多文件列表播放</div>
        </div>
        <div class="heart-layer" id="heartLayer"></div>
        <div class="jump-flash" id="jumpFlash"></div>
        <div class="subtitle-layer" id="subtitleLayer"></div>
        <div class="status-pill" id="statusPill">准备就绪</div>
        <div class="fullscreen-progress" id="fullscreenProgressWrap">
          <div class="progress-track thin">
            <div class="progress-fill" id="fullscreenProgressFill"></div>
            <input id="fullscreenProgress" type="range" min="0" max="1000" step="1" value="0" aria-label="全屏进度" />
          </div>
        </div>
        <div class="player-controls" id="playerControls">
          <button class="icon-btn" id="playBtn" type="button" title="播放 / 暂停">▶</button>
          <div class="time-text"><span id="currentTime">00:00</span><span>/</span><span id="duration">00:00</span></div>
          <div class="flex-progress">
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
              <input id="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="媒体进度" />
            </div>
          </div>
          <button class="icon-btn" id="muteBtn" type="button" title="静音">🔊</button>
          <button class="icon-btn" id="fullscreenBtn" type="button" title="全屏">⛶</button>
        </div>
      </div>
    </section>

    <section class="metric-row">
      <div class="metric-card neumorph-light">
        <span>计步可播放</span><strong id="grantDisplay">00:00</strong>
      </div>
      <div class="metric-card neumorph-light">
        <span>待处理步数</span><strong id="pendingDisplay">0</strong>
      </div>
      <div class="metric-card neumorph-light">
        <span>媒体</span><strong id="mediaIndexDisplay">0 / 0</strong>
      </div>
      <div class="metric-card neumorph-light">
        <span>音乐律动</span><strong id="beatStateDisplay">关闭</strong>
      </div>
    </section>

    <section class="toolbar neumorph-light">
      <div class="toolbar-group">
        <label class="file-btn primary" for="mediaInput">上传媒体</label>
        <input id="mediaInput" type="file" accept="video/*,audio/*" multiple hidden />
        <label class="file-btn" for="subtitleInput">上传字幕</label>
        <input id="subtitleInput" type="file" accept=".json,.lrc,.vtt,.txt,application/json,text/plain,text/vtt" hidden />
        <label class="file-btn" for="musicInput">上传音乐</label>
        <input id="musicInput" type="file" accept="audio/*" hidden />
        <button class="soft-btn" id="warmupBtn" type="button">预热 2:15</button>
      </div>
      <div class="toolbar-group right">
        <button class="soft-btn" id="sensorBtn" type="button">开启计步</button>
        <button class="soft-btn danger" id="clearSubtitleBtn" type="button">移除字幕</button>
        <button class="soft-btn danger" id="clearMusicBtn" type="button">移除音乐</button>
        <button class="soft-btn danger" id="clearListBtn" type="button">清空列表</button>
      </div>
    </section>

    <section class="content-grid">
      <div class="panel neumorph-light">
        <div class="panel-head"><h2>播放列表</h2><label class="switch-line"><input id="shuffleToggle" type="checkbox" /><span>乱序</span></label></div>
        <div class="playlist" id="playlist"></div>
      </div>
      <div class="panel neumorph-light">
        <div class="panel-head"><h2>当前资源</h2><span class="muted" id="resourceName">未选择</span></div>
        <div class="info-list">
          <div><span>字幕</span><strong id="subtitleStatus">未加载</strong></div>
          <div><span>音乐</span><strong id="musicStatus">未加载</strong></div>
          <div><span>播放段</span><strong id="segmentStatus">普通模式</strong></div>
        </div>
      </div>
    </section>

    <section class="settings-panel neumorph-light" id="settingsPanel">
      <div class="settings-head"><h2>设置</h2><button class="close-panel" id="hideSettingsBtn" type="button">—</button></div>
      <div class="settings-grid">
        <div class="setting">
          <label>每次计步播放 <b id="stepGrantLabel">15s</b></label>
          <input id="stepGrant" type="range" min="1" max="180" step="1" value="15" />
          <input id="stepGrantNum" class="number-input" type="number" min="1" max="180" step="1" value="15" />
        </div>
        <div class="setting">
          <label>结算窗口 <b id="settleWindowLabel">5s</b></label>
          <input id="settleWindow" type="range" min="0" max="30" step="1" value="5" />
          <input id="settleWindowNum" class="number-input" type="number" min="0" max="30" step="1" value="5" />
        </div>
        <div class="setting">
          <label>播放速度 <b id="rateLabel">1.00×</b></label>
          <input id="rate" type="range" min="0.25" max="4" step="0.05" value="1" />
          <input id="rateNum" class="number-input" type="number" min="0.25" max="4" step="0.01" value="1" />
        </div>
        <div class="setting">
          <label>媒体音量 <b id="volumeLabel">100%</b></label>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
          <input id="volumeNum" class="number-input" type="number" min="0" max="1" step="0.01" value="1" />
        </div>
        <div class="setting wide">
          <label>音乐音量 <b id="musicVolumeLabel">60%</b></label>
          <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.6" />
          <input id="musicVolumeNum" class="number-input" type="number" min="0" max="1" step="0.01" value="0.6" />
        </div>
        <div class="setting">
          <label>节拍触发阈值 <b id="beatThresholdLabel">0.55</b></label>
          <input id="beatThreshold" type="range" min="0.05" max="1" step="0.01" value="0.55" />
          <input id="beatThresholdNum" class="number-input" type="number" min="0.05" max="1" step="0.01" value="0.55" />
        </div>
        <div class="setting">
          <label>跳跃冷却 <b id="jumpCooldownLabel">1.50s</b></label>
          <input id="jumpCooldown" type="range" min="0.1" max="15" step="0.01" value="1.5" />
          <input id="jumpCooldownNum" class="number-input" type="number" min="0.1" max="15" step="0.01" value="1.5" />
        </div>
        <div class="setting">
          <label>跳跃避开：开头分钟 <b id="avoidStartLabel">0</b></label>
          <input id="avoidStart" type="range" min="0" max="30" step="0.5" value="0" />
          <input id="avoidStartNum" class="number-input" type="number" min="0" max="30" step="0.5" value="0" />
        </div>
        <div class="setting">
          <label>跳跃避开：结尾分钟 <b id="avoidEndLabel">0</b></label>
          <input id="avoidEnd" type="range" min="0" max="30" step="0.5" value="0" />
          <input id="avoidEndNum" class="number-input" type="number" min="0" max="30" step="0.5" value="0" />
        </div>
      </div>
      <div class="settings-note">音乐律动：通过 Web Audio 分析音乐频谱/能量突增（spectral flux）检测节拍，达到阈值后执行一次随机跳转，并用冷却窗口防止高频连跳。全屏时跳跃会触发底部闪动与短震动。</div>
    </section>
  </main>

  <aside class="side-dock">
    <button id="toggleSettingsBtn" type="button" class="dock-btn" title="显示 / 隐藏设置">⚙</button>
  </aside>

  <script src="app.js"></script>
</body>
</html>
