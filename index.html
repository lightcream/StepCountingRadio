<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neu-Media Step Rhythm Player</title>
    <style>
        :root {
            /* 灰色底色 */
            --bg-color: #2a2b2f;
            /* 暗黑色模块色 */
            --module-color: #151618;
            /* 亮青蓝色 (纯色) */
            --cyan-blue: #00e0ff;
            /* 新拟态阴影 */
            --shadow-dark: #0d0e0f;
            --shadow-light: #232529;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* 基础新拟态模块 (暗黑) */
        .neu-module {
            background: var(--module-color);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 纯色霓虹青蓝按钮 */
        .neu-btn {
            background: var(--cyan-blue);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s ease;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.4), inset 2px 2px 4px rgba(255,255,255,0.4);
            text-align: center;
        }

        .neu-btn:active {
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.5), inset -1px -1px 3px rgba(255,255,255,0.3);
            transform: scale(0.98);
        }

        .neu-btn.danger {
            background: #ff3b3b;
            color: #fff;
        }
        
        .neu-btn.outline {
            background: var(--module-color);
            color: var(--cyan-blue);
            border: 1px solid var(--cyan-blue);
            box-shadow: none;
        }

        input[type="number"], input[type="text"] {
            background: #0f1011;
            border: 1px solid #333;
            color: var(--cyan-blue);
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            width: 70px;
            text-align: center;
            font-weight: bold;
        }

        /* 主体布局 */
        #media-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        video::-webkit-media-controls { display: none !important; }

        /* 设置面板 */
        #settings-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55vh;
            background: var(--bg-color);
            padding: 25px;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow-y: auto;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
        }

        #settings-panel.hidden {
            transform: translateY(100%);
        }

        /* 模块网格排列，保证大小统一 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding-bottom: 30px;
        }

        .neu-module h3 {
            font-size: 14px;
            color: var(--text-main);
            border-bottom: 2px solid #222;
            padding-bottom: 8px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        /* FAB整合按钮 */
        #toggle-fab {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            font-size: 22px;
            transition: all 0.3s;
            padding: 0;
        }
        
        #toggle-fab.fab-hidden-mode {
            bottom: 15px;
            right: 0px;
            width: 35px;
            height: 40px;
            border-radius: 20px 0 0 20px;
            opacity: 0.6;
        }

        #toggle-fab.fab-hidden-mode:hover { opacity: 1; }

        /* 进度条 */
        #progress-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #222;
            z-index: 150;
            cursor: pointer;
            transition: all 0.3s;
        }

        #settings-panel:not(.hidden) ~ #progress-wrapper {
            bottom: 55vh;
            height: 8px;
            background: #111;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--cyan-blue);
            box-shadow: 0 0 10px var(--cyan-blue);
            position: relative;
            transition: width 0.1s linear;
        }

        /* 律动跳跃时的震动与变色动画 */
        @keyframes beatFlash {
            0% { background: #fff; box-shadow: 0 0 20px #fff; }
            50% { background: #ff00ff; box-shadow: 0 0 20px #ff00ff; }
            100% { background: var(--cyan-blue); box-shadow: 0 0 10px var(--cyan-blue); }
        }
        .beat-jump-anim {
            animation: beatFlash 0.4s ease-out;
        }

        /* 进度提示 */
        #progress-thumb {
            position: absolute;
            right: -6px;
            top: -4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #settings-panel:not(.hidden) ~ #progress-wrapper:hover #progress-thumb { opacity: 1; }
        
        #progress-tooltip {
            position: absolute;
            top: -28px;
            right: -15px;
            background: var(--cyan-blue);
            color: #000;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
        }
        #progress-wrapper:hover #progress-tooltip { opacity: 1; }

        /* 全屏飘爱心 */
        .heart {
            position: absolute;
            color: #ff3b6b;
            font-size: 28px;
            pointer-events: none;
            animation: floatUp 2s ease-in forwards;
            z-index: 10;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
        }

        /* 列表与其他控件 */
        input[type="file"] { display: none; }
        .file-label { display: inline-block; flex: 1; }
        
        .flex-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        .flex-col { display: flex; flex-direction: column; gap: 8px; }

        #playlist {
            max-height: 90px;
            overflow-y: auto;
            background: #0f1011;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .playlist-item {
            display: flex;
            justify-content: space-between;
            padding: 6px;
            border-bottom: 1px solid #222;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-muted);
        }
        .playlist-item:hover { color: #fff; }
        .playlist-item.active { color: var(--cyan-blue); font-weight: bold; }
        .remove-btn { color: #ff3b3b; cursor: pointer; padding-left: 10px; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100px;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--cyan-blue);
            margin-top: -5px;
            cursor: pointer;
        }
        .status-text { font-size: 11px; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- 媒体展示区 -->
    <div id="media-container">
        <video id="main-video" playsinline></video>
        <audio id="rhythm-audio"></audio>
    </div>

    <!-- 进度条 -->
    <div id="progress-wrapper">
        <div id="progress-bar">
            <div id="progress-thumb">
                <div id="progress-tooltip">0%</div>
            </div>
        </div>
    </div>

    <!-- 全屏与隐藏控制按钮 -->
    <button id="toggle-fab" class="neu-btn">⛶</button>

    <!-- 设置面板 -->
    <div id="settings-panel">
        <div class="grid-container">
            
            <!-- 模块 1：媒体库 -->
            <div class="neu-module">
                <h3>媒体库 
                    <button class="neu-btn outline" id="shuffle-btn" style="padding:4px 8px; font-size:10px;">顺序播放</button>
                </h3>
                <div class="flex-row">
                    <label class="file-label neu-btn">
                        <input type="file" id="media-upload" multiple accept="video/*,audio/*">
                        ➕ 上传音视频资源
                    </label>
                </div>
                <div id="playlist"></div>
                <div class="flex-row" style="justify-content: flex-start;">
                    <span class="status-text">媒体音量:</span>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                    <span class="status-text" style="margin-left:10px;">倍速:</span>
                    <input type="number" id="speed-input" value="1.0" step="0.1" style="width:50px;">
                    <input type="range" id="speed-slider" min="0.25" max="3" step="0.05" value="1.0" style="width:60px;">
                </div>
            </div>

            <!-- 模块 2：计步与播放 -->
            <div class="neu-module">
                <h3>计步器控制</h3>
                <div class="flex-row">
                    <button id="play-pause-btn" class="neu-btn outline" style="flex:1;">▶ 自由播放/暂停</button>
                    <button id="warmup-btn" class="neu-btn" style="flex:1;">🔥 预热(2分15秒)</button>
                </div>
                <button id="enable-step-btn" class="neu-btn outline">👣 授权手机传感器计步</button>
                <div class="flex-row">
                    <div class="flex-col" style="flex:1;">
                        <span class="status-text">单次增加时间(秒)</span>
                        <input type="number" id="step-duration" value="5" step="0.1" style="width:100%;">
                    </div>
                    <div class="flex-col" style="flex:1;">
                        <span class="status-text">倒数重叠防抖窗口(秒)</span>
                        <input type="number" id="step-window" value="1" step="0.1" style="width:100%;">
                    </div>
                </div>
                <div class="status-text">规则：当剩余播放时间 <= 防抖窗口时，计步才会激活增加时间，防止疯狂叠加。</div>
            </div>

            <!-- 模块 3：字幕处理 -->
            <div class="neu-module">
                <h3>智能字幕 (TTS朗读)</h3>
                <div class="flex-row">
                    <label class="file-label neu-btn">
                        <input type="file" id="sub-upload" accept=".json,.lrc,.vtt">
                        📝 上传字幕文件
                    </label>
                    <button id="remove-sub-btn" class="neu-btn danger">移除</button>
                </div>
                <div class="status-text" id="sub-status" style="color:var(--cyan-blue);">未加载字幕</div>
                <div class="status-text">进度条推进到字幕时间 -> 暂停画面 -> 调用系统TTS朗读中文 -> 恢复播放当前画面 -> 寻找下一条。</div>
            </div>

            <!-- 模块 4：音乐律动 -->
            <div class="neu-module">
                <h3>音乐律动卡点跳跃</h3>
                <div class="flex-row">
                    <label class="file-label neu-btn">
                        <input type="file" id="music-upload" accept="audio/*">
                        🎵 上传律动音乐
                    </label>
                    <button id="remove-music-btn" class="neu-btn danger">移除</button>
                </div>
                <div class="flex-row" style="justify-content: flex-start;">
                    <span class="status-text">音乐音量:</span>
                    <input type="range" id="music-volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
                <div class="flex-row">
                    <div class="flex-col">
                        <span class="status-text">触发阈值(0-255)</span>
                        <input type="number" id="beat-threshold" value="200">
                    </div>
                    <div class="flex-col">
                        <span class="status-text">冷却(秒)</span>
                        <input type="number" id="beat-cooldown" value="0.5" step="0.01">
                    </div>
                </div>
                <div class="flex-row">
                    <div class="flex-col">
                        <span class="status-text">开头避让(分)</span>
                        <input type="number" id="safe-start" value="1" step="0.1">
                    </div>
                    <div class="flex-col">
                        <span class="status-text">结尾避让(分)</span>
                        <input type="number" id="safe-end" value="1" step="0.1">
                    </div>
                </div>
                <div class="status-text" style="font-size:10px; line-height:1.2;">原理：WebAudioAPI提取音乐实时低频(Bass)能量，突破阈值且过冷却期后，在避让区外随机生成时间戳，画面瞬间跃迁，实现不断音卡点切镜。</div>
            </div>

        </div>
    </div>

    <script>
        // DOM 元素获取
        const video = document.getElementById('main-video');
        const rhythmAudio = document.getElementById('rhythm-audio');
        const container = document.getElementById('media-container');
        const toggleFab = document.getElementById('toggle-fab');
        const settingsPanel = document.getElementById('settings-panel');
        const progressWrapper = document.getElementById('progress-wrapper');
        const progressBar = document.getElementById('progress-bar');
        const progressTooltip = document.getElementById('progress-tooltip');
        const playlistDiv = document.getElementById('playlist');
        const subStatus = document.getElementById('sub-status');
        
        // 核心播放控制状态
        let playlist = [];
        let currentIndex = -1;
        let isShuffle = false;
        let globalSpeed = 1.0;
        
        // 播放预算（秒），精确倒计时
        let playbackBudget = 0; 
        let lastFrameTime = performance.now();
        
        // 字幕TTS状态
        let isTTSPlaying = false; 
        let subtitles = [];
        let currentSubIndex = 0;
        let synth = window.speechSynthesis;

        // 音频律动状态
        let audioCtx, analyser, dataArray;
        let lastJumpTime = 0;
        let rhythmEnabled = false;

        // 传感器计步状态
        let lastAcc = 0;

        // --- 初始化与主循环 ---
        function initApp() {
            requestAnimationFrame(mainLoop);
            // iOS解锁语音机制
            document.body.addEventListener('click', () => {
                if(synth.getVoices().length === 0) synth.getVoices();
            }, {once: true});
        }

        function mainLoop(now) {
            let dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;

            // 1. 播放时间结算逻辑
            if (playbackBudget > 0 && !isTTSPlaying) {
                if (video.paused && video.src) {
                    video.play().catch(e=>console.log("Play interrupted:", e));
                    if(rhythmEnabled && rhythmAudio.src) rhythmAudio.play().catch(e=>{});
                }
                playbackBudget -= dt;
                
                if (playbackBudget <= 0) {
                    playbackBudget = 0;
                    video.pause();
                    if(rhythmEnabled) rhythmAudio.pause();
                }
            } else if (!isTTSPlaying && playbackBudget <= 0 && !video.paused) {
                // 确保预算归零时停止（拦截拖动进度条带来的自动播放）
                video.pause();
                if(rhythmEnabled) rhythmAudio.pause();
            }

            // 2. 字幕 TTS 拦截逻辑
            if (subtitles.length > 0 && currentSubIndex < subtitles.length && video.src) {
                let nextSub = subtitles[currentSubIndex];
                if (video.currentTime >= nextSub.start && !isTTSPlaying) {
                    video.pause();
                    if(rhythmEnabled) rhythmAudio.pause();
                    isTTSPlaying = true;
                    
                    let utterance = new SpeechSynthesisUtterance(nextSub.text);
                    utterance.lang = 'zh-CN';
                    utterance.rate = 1.2;
                    utterance.onend = () => {
                        isTTSPlaying = false;
                        currentSubIndex++;
                    };
                    utterance.onerror = () => {
                        isTTSPlaying = false;
                        currentSubIndex++;
                    }
                    synth.speak(utterance);
                }
            }

            // 3. 音乐律动逻辑
            if (rhythmEnabled && !rhythmAudio.paused && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                // 采集极低频部分(Bass)
                for(let i = 0; i < 8; i++) sum += dataArray[i];
                let avg = sum / 8;

                let threshold = parseFloat(document.getElementById('beat-threshold').value);
                let cooldown = parseFloat(document.getElementById('beat-cooldown').value) * 1000;

                if (avg > threshold && (now - lastJumpTime > cooldown)) {
                    lastJumpTime = now;
                    jumpVideoToSafeZone();
                }
            }

            // 4. 更新进度条 UI
            if (video.duration) {
                let percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = percent + '%';
                progressTooltip.innerText = percent.toFixed(1) + '%';
            }

            requestAnimationFrame(mainLoop);
        }

        // --- 跳跃控制 ---
        function jumpVideoToSafeZone() {
            if(!video.duration) return;
            let safeStart = parseFloat(document.getElementById('safe-start').value) * 60;
            let safeEnd = video.duration - (parseFloat(document.getElementById('safe-end').value) * 60);
            
            if (safeStart >= safeEnd || safeStart < 0) {
                safeStart = 0; safeEnd = video.duration;
            }
            
            let randomTime = safeStart + Math.random() * (safeEnd - safeStart);
            video.currentTime = randomTime;
            updateSubIndexOnSeek();
            
            // 底部变色动画
            progressBar.classList.remove('beat-jump-anim');
            void progressBar.offsetWidth;
            progressBar.classList.add('beat-jump-anim');
            
            // 震动
            if(document.fullscreenElement && navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // --- 全屏与整合面板开关 ---
        toggleFab.addEventListener('click', () => {
            let isHidden = settingsPanel.classList.toggle('hidden');
            if (isHidden) {
                toggleFab.classList.add('fab-hidden-mode');
                toggleFab.innerText = '⚙';
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => console.log(err));
                }
            } else {
                toggleFab.classList.remove('fab-hidden-mode');
                toggleFab.innerText = '⛶';
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(e=>{});
                }
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                settingsPanel.classList.remove('hidden');
                toggleFab.classList.remove('fab-hidden-mode');
                toggleFab.innerText = '⛶';
            }
        });

        // --- 拖拽进度条 ---
        progressWrapper.addEventListener('click', (e) => {
            if (!video.duration) return;
            let rect = progressWrapper.getBoundingClientRect();
            let pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
            updateSubIndexOnSeek();
            // 防止拖动时意外播放，不注入 budget
        });

        function updateSubIndexOnSeek() {
            if (subtitles.length === 0) return;
            currentSubIndex = subtitles.findIndex(s => s.start >= video.currentTime);
            if (currentSubIndex === -1) currentSubIndex = subtitles.length;
        }
        video.addEventListener('seeked', updateSubIndexOnSeek);

        // --- 媒体库列表控制 (支持大型文件) ---
        document.getElementById('media-upload').addEventListener('change', (e) => {
            let files = Array.from(e.target.files);
            // URL.createObjectURL 直接映射本地大文件，不占用内存
            files.forEach(file => {
                playlist.push({
                    name: file.name,
                    url: URL.createObjectURL(file)
                });
            });
            renderPlaylist();
            if (currentIndex === -1 && playlist.length > 0) playMedia(0);
        });

        function renderPlaylist() {
            playlistDiv.innerHTML = '';
            playlist.forEach((item, index) => {
                let div = document.createElement('div');
                div.className = 'playlist-item' + (index === currentIndex ? ' active' : '');
                
                let title = document.createElement('span');
                title.innerText = item.name;
                title.onclick = () => playMedia(index);
                
                let del = document.createElement('span');
                del.className = 'remove-btn';
                del.innerText = '✖';
                del.onclick = (e) => {
                    e.stopPropagation();
                    URL.revokeObjectURL(item.url); // 释放内存指针
                    playlist.splice(index, 1);
                    if (currentIndex === index) {
                        video.src = '';
                        currentIndex = -1;
                        playbackBudget = 0;
                    } else if (currentIndex > index) {
                        currentIndex--;
                    }
                    renderPlaylist();
                };
                
                div.appendChild(title);
                div.appendChild(del);
                playlistDiv.appendChild(div);
            });
        }

        function playMedia(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            video.src = playlist[index].url;
            video.playbackRate = globalSpeed; // 倍速不失效
            currentSubIndex = 0; 
            renderPlaylist();
            playbackBudget = 3; // 上传后给3秒预览
        }

        video.addEventListener('ended', () => {
            if (playlist.length <= 1) {
                playbackBudget = 0;
                return;
            }
            let next = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentIndex + 1) % playlist.length;
            playMedia(next);
            // 自动下一P注入默认预算
            playbackBudget = parseFloat(document.getElementById('step-duration').value); 
        });

        let shuffleBtn = document.getElementById('shuffle-btn');
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.innerText = isShuffle ? '🔀 乱序播放' : '🔁 顺序播放';
            shuffleBtn.style.background = isShuffle ? 'var(--cyan-blue)' : 'var(--module-color)';
            shuffleBtn.style.color = isShuffle ? '#000' : 'var(--cyan-blue)';
        });

        // 手动播放控制
        let playBtn = document.getElementById('play-pause-btn');
        playBtn.addEventListener('click', () => {
            if (video.paused || playbackBudget <= 0) {
                playbackBudget = 999999; // 自由播放无限预算
                playBtn.innerText = '⏸ 暂停';
            } else {
                playbackBudget = 0;
                playBtn.innerText = '▶ 自由播放';
            }
        });
        video.addEventListener('pause', () => playBtn.innerText = '▶ 自由播放');
        video.addEventListener('play', () => playBtn.innerText = '⏸ 暂停');

        // 音量与倍速
        const speedInput = document.getElementById('speed-input');
        const speedSlider = document.getElementById('speed-slider');
        function updateSpeed(val) {
            globalSpeed = parseFloat(val);
            speedInput.value = globalSpeed;
            speedSlider.value = globalSpeed;
            video.playbackRate = globalSpeed;
        }
        speedInput.addEventListener('change', e => updateSpeed(e.target.value));
        speedSlider.addEventListener('input', e => updateSpeed(e.target.value));

        document.getElementById('volume-slider').addEventListener('input', e => video.volume = e.target.value);
        document.getElementById('music-volume-slider').addEventListener('input', e => rhythmAudio.volume = e.target.value);

        // --- 字幕解析逻辑 ---
        document.getElementById('sub-upload').addEventListener('change', (e) => {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = (ev) => {
                let text = ev.target.result;
                let ext = file.name.split('.').pop().toLowerCase();
                parseSubtitles(text, ext);
                subStatus.innerText = `[加载成功] ${file.name} - 共${subtitles.length}条`;
                currentSubIndex = 0;
                updateSubIndexOnSeek();
            };
            reader.readAsText(file);
        });

        document.getElementById('remove-sub-btn').addEventListener('click', () => {
            subtitles = [];
            currentSubIndex = 0;
            subStatus.innerText = '未加载字幕';
            document.getElementById('sub-upload').value = '';
        });

        function parseSubtitles(text, type) {
            subtitles = [];
            if (type === 'json') {
                try {
                    let arr = JSON.parse(text);
                    subtitles = arr.map(item => ({ start: parseFloat(item.from), text: item.content }));
                } catch(e) { alert('JSON解析失败'); }
            } else if (type === 'lrc') {
                let lines = text.split('\n');
                let regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
                lines.forEach(line => {
                    let match = line.match(regex);
                    if (match && match[4].trim()) {
                        let start = parseInt(match[1])*60 + parseInt(match[2]) + parseInt(match[3].padEnd(3,'0'))/1000;
                        subtitles.push({ start, text: match[4].trim() });
                    }
                });
            } else if (type === 'vtt') {
                let blocks = text.split(/\n\s*\n/);
                let timeRegex = /(?:(\d{2}):)?(\d{2}):(\d{2})\.(\d{3})\s+-->/;
                blocks.forEach(block => {
                    let lines = block.split('\n');
                    let tIdx = lines.findIndex(l => timeRegex.test(l));
                    if (tIdx !== -1) {
                        let m = lines[tIdx].match(timeRegex);
                        let h = m[1] ? parseInt(m[1]) : 0;
                        let start = h*3600 + parseInt(m[2])*60 + parseInt(m[3]) + parseInt(m[4])/1000;
                        let content = lines.slice(tIdx + 1).join(' ').replace(/<[^>]+>/g, '').trim();
                        if (content) subtitles.push({ start, text: content });
                    }
                });
            }
            subtitles.sort((a,b) => a.start - b.start);
        }

        // --- 音乐律动加载 ---
        document.getElementById('music-upload').addEventListener('change', (e) => {
            let file = e.target.files[0];
            if (!file) return;
            rhythmAudio.src = URL.createObjectURL(file);
            rhythmEnabled = true;

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                let source = audioCtx.createMediaElementSource(rhythmAudio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();
        });

        document.getElementById('remove-music-btn').addEventListener('click', () => {
            rhythmAudio.src = '';
            rhythmEnabled = false;
            document.getElementById('music-upload').value = '';
        });

        // --- 计步传感器逻辑 ---
        const stepBtn = document.getElementById('enable-step-btn');
        stepBtn.addEventListener('click', () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(state => {
                    if (state === 'granted') {
                        startPedometer();
                        stepBtn.style.background = 'var(--cyan-blue)';
                        stepBtn.style.color = '#000';
                    } else alert('权限被拒绝');
                }).catch(console.error);
            } else {
                startPedometer(); 
                stepBtn.style.background = 'var(--cyan-blue)';
                stepBtn.style.color = '#000';
            }
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        });

        function startPedometer() {
            window.addEventListener('devicemotion', (e) => {
                let acc = Math.sqrt(
                    Math.pow(e.accelerationIncludingGravity.x, 2) +
                    Math.pow(e.accelerationIncludingGravity.y, 2) +
                    Math.pow(e.accelerationIncludingGravity.z, 2)
                );
                let delta = Math.abs(acc - lastAcc);
                lastAcc = acc;
                // 检测到明显震动(步数)
                if (delta > 2.5) triggerStep();
            });
        }

        function triggerStep() {
            let windowSec = parseFloat(document.getElementById('step-window').value);
            let duration = parseFloat(document.getElementById('step-duration').value);
            
            // 核心防叠加：只有当剩余播放时间 <= 防抖窗口时，才会重置注入播放时间
            if (playbackBudget <= windowSec) {
                playbackBudget = duration;
            }

            if (document.fullscreenElement) createHeart();
        }

        document.getElementById('warmup-btn').addEventListener('click', () => {
            playbackBudget = 135; // 2分钟15秒
        });

        function createHeart() {
            let heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 80 + 10 + '%';
            heart.style.bottom = '20px';
            container.appendChild(heart);
            setTimeout(() => { if(container.contains(heart)) container.removeChild(heart); }, 2000);
        }

        initApp();
    </script>
</body>
</html>
